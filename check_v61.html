<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ASTON Q.A. v6.1 - 专业满血版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .defect-btn.active { background-color: #ef4444; color: white; border-color: #ef4444; shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .check-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .check-card:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900 pb-32">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl relative">
        <!-- 头部 -->
        <header class="bg-slate-900 text-white p-5 sticky top-0 z-30 flex justify-between items-center shadow-lg border-b border-slate-800">
            <div>
                <h1 class="text-xl font-black italic tracking-tighter leading-none">ASTON Q.A. <span class="text-blue-500 italic text-sm">PRO v6.1</span></h1>
                <p class="text-[8px] font-bold text-slate-500 uppercase tracking-widest mt-1">Quality Assurance System</p>
            </div>
            <button onclick="loadPlans()" class="p-2 bg-slate-800 rounded-xl active:scale-90 transition-all border border-slate-700 shadow-inner">
                <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </header>

        <!-- 任务无缝对接区 -->
        <section class="p-5">
            <div class="bg-gradient-to-br from-blue-600 to-blue-800 p-6 rounded-[2rem] shadow-xl shadow-blue-100 mb-6 border-b-4 border-blue-900">
                <label class="block text-[10px] font-black text-blue-200 mb-2 tracking-widest uppercase italic">Step 1: Choose Your Plan</label>
                <select id="planSelector" onchange="applyPlan(this.value)" class="w-full bg-white/10 text-white p-4 rounded-2xl border border-white/20 outline-none font-black text-lg appearance-none cursor-pointer backdrop-blur-md">
                    <option value="" class="text-slate-800 italic">-- SELECT PO# --</option>
                </select>
                <div class="flex justify-between items-center mt-3">
                    <p id="planCount" class="text-[9px] text-blue-200 font-bold italic tracking-wide">Connecting to HQ Plan Center...</p>
                    <span class="text-[9px] bg-white/20 text-white px-2 py-0.5 rounded-full font-bold">LIVE</span>
                </div>
            </div>

            <!-- 自动填写的订单详情卡片 -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-inner">
                    <label class="block text-[9px] font-black text-slate-400 uppercase mb-1 tracking-tighter">Style Description</label>
                    <input type="text" id="styleDesc" readonly class="w-full bg-transparent text-xs font-black text-slate-700 outline-none" placeholder="Style Name">
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-inner">
                    <label class="block text-[9px] font-black text-slate-400 uppercase mb-1 tracking-tighter">Order Quantity</label>
                    <input type="text" id="orderQty" readonly class="w-full bg-transparent text-xs font-black text-slate-700 outline-none" placeholder="Units">
                </div>
            </div>
        </section>

        <!-- 核心：17项瑕疵词库 -->
        <section class="px-5 mb-8">
            <h2 class="text-[11px] font-black text-slate-900 mb-4 tracking-widest uppercase flex items-center">
                <span class="w-8 h-[2px] bg-red-500 mr-3 rounded-full"></span> 17 Defect Points
            </h2>
            <div id="defectContainer" class="grid grid-cols-3 gap-2"></div>
        </section>

        <!-- 核心：6组外观检查 -->
        <section class="px-5 mb-10">
            <h2 class="text-[11px] font-black text-slate-900 mb-4 tracking-widest uppercase flex items-center">
                <span class="w-8 h-[2px] bg-blue-500 mr-3 rounded-full"></span> 6 Section Reviews
            </h2>
            <div id="sectionContainer" class="space-y-3"></div>
        </section>

        <!-- 强制：现场照片 -->
        <section class="px-5 mb-24">
            <h2 class="text-[11px] font-black text-slate-900 mb-4 tracking-widest uppercase flex items-center">
                <span class="w-8 h-[2px] bg-slate-900 mr-3 rounded-full"></span> Mandatory Photos
            </h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="relative bg-slate-100 border-2 border-dashed border-slate-300 rounded-[2rem] aspect-square flex items-center justify-center overflow-hidden check-card group">
                    <input type="file" accept="image/*" capture="camera" class="absolute inset-0 opacity-0 z-10" onchange="previewImg(this, 'img1')">
                    <img id="img1" class="hidden absolute inset-0 w-full h-full object-cover">
                    <div class="text-center">
                        <div class="text-4xl text-slate-300 font-light mb-1 group-active:scale-110 transition-transform">+</div>
                        <div class="text-[9px] font-black text-slate-400 uppercase italic">Factory Gate</div>
                    </div>
                </div>
                <div class="relative bg-slate-100 border-2 border-dashed border-slate-300 rounded-[2rem] aspect-square flex items-center justify-center overflow-hidden check-card group">
                    <input type="file" accept="image/*" capture="camera" class="absolute inset-0 opacity-0 z-10" onchange="previewImg(this, 'img2')">
                    <img id="img2" class="hidden absolute inset-0 w-full h-full object-cover">
                    <div class="text-center">
                        <div class="text-4xl text-slate-300 font-light mb-1 group-active:scale-110 transition-transform">+</div>
                        <div class="text-[9px] font-black text-slate-400 uppercase italic">Defect Detail</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 悬浮提交按钮 -->
        <div class="fixed bottom-0 left-0 right-0 p-5 bg-white/90 backdrop-blur-2xl border-t border-slate-100 z-40">
            <button id="btnSubmit" onclick="uploadData()" class="w-full py-5 bg-slate-900 text-white font-black rounded-2xl shadow-2xl active:scale-95 transition-all text-[11px] tracking-[0.3em] uppercase italic flex items-center justify-center gap-3">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                Finalize Inspection
            </button>
        </div>
    </div>

    <script>
        // 核心参数区
        const PLAN_ID = "496f86c2d135d46f396a"; 
        const RESULT_ID = "07c1348873426e952613";
        
        // 17项瑕疵词库 (回归版)
        const defects = [
            "Stains/污渍", "Skip Stitch/跳针", "Open Seam/脱线", "Shading/色差", 
            "Measurement/尺寸", "Hole/破洞", "Dirty/脏污", "Wrinkle/折皱", 
            "Zipper/拉链", "Label/标签", "Button/扣子", "Trim/线头", 
            "Packing/包装", "Print/印花", "Fabric/面料", "Odour/异味", "Metal/金属"
        ];

        // 6组外观检查逻辑 (回归版)
        const sections = [
            { name: "Fabric Check / 面料外观", icon: "🧵" },
            { name: "Workmanship / 做工品质", icon: "✂️" },
            { name: "Accessories / 辅料配件", icon: "📎" },
            { name: "Labeling / 标签唛头", icon: "🏷️" },
            { name: "Packaging / 包装规范", icon: "📦" },
            { name: "Overall Rating / 总体评价", icon: "⭐" }
        ];

        let activePlans = [];
        let selectedDefects = [];
        let sectionStatus = {};

        // 初始化计划 (无缝对接)
        async function loadPlans() {
            const selector = document.getElementById('planSelector');
            const countLabel = document.getElementById('planCount');
            selector.innerHTML = '<option value="">-- REFRESHING... --</option>';
            try {
                const res = await fetch(`https://api.npoint.io/${PLAN_ID}`, {cache: 'no-cache'});
                const data = await res.json();
                if(Array.isArray(data)) {
                    activePlans = data;
                    selector.innerHTML = '<option value="">CHOOSE PO#</option>' + 
                        data.map(p => `<option value="${p.po}">${p.po}</option>`).join('');
                    countLabel.innerText = `READY: Found ${data.length} orders in queue.`;
                }
            } catch(e) {
                selector.innerHTML = '<option value="">-- SYNC FAILED --</option>';
                countLabel.innerText = "Error fetching plans.";
            }
        }

        function applyPlan(po) {
            const plan = activePlans.find(p => p.po === po);
            if(plan) {
                document.getElementById('styleDesc').value = plan.style;
                document.getElementById('orderQty').value = plan.qty + " Units";
            }
        }

        // 初始化17项瑕疵
        const dContainer = document.getElementById('defectContainer');
        defects.forEach(d => {
            const btn = document.createElement('button');
            btn.className = "p-2 text-[9px] font-black border-2 border-slate-50 rounded-xl bg-slate-50 text-slate-400 transition-all text-center h-12 flex items-center justify-center leading-tight";
            btn.innerText = d.split('/')[0];
            btn.onclick = () => {
                if(selectedDefects.includes(d)) {
                    selectedDefects = selectedDefects.filter(i => i !== d);
                    btn.classList.remove('active');
                } else {
                    selectedDefects.push(d);
                    btn.classList.add('active');
                }
            };
            dContainer.appendChild(btn);
        });

        // 初始化6组检查
        const sContainer = document.getElementById('sectionContainer');
        sections.forEach(s => {
            const div = document.createElement('div');
            div.className = "bg-white border border-slate-100 p-4 rounded-2xl flex items-center justify-between shadow-sm";
            div.innerHTML = `
                <div class="flex items-center gap-3">
                    <span class="text-lg">${s.icon}</span>
                    <span class="text-[10px] font-black uppercase text-slate-700">${s.name}</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="setSection('${s.name}', 'Pass', this)" class="w-10 h-8 rounded-lg bg-slate-50 text-slate-400 font-bold text-[8px] flex items-center justify-center transition-all">PASS</button>
                    <button onclick="setSection('${s.name}', 'Fail', this)" class="w-10 h-8 rounded-lg bg-slate-50 text-slate-400 font-bold text-[8px] flex items-center justify-center transition-all">FAIL</button>
                </div>
            `;
            sContainer.appendChild(div);
        });

        function setSection(name, status, btn) {
            sectionStatus[name] = status;
            const parent = btn.parentElement;
            parent.querySelectorAll('button').forEach(b => {
                b.classList.remove('bg-green-500', 'bg-red-500', 'text-white');
                b.classList.add('bg-slate-50', 'text-slate-400');
            });
            btn.classList.remove('bg-slate-50', 'text-slate-400');
            btn.classList.add(status === 'Pass' ? 'bg-green-500' : 'bg-red-500', 'text-white');
        }

        function previewImg(input, targetId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    const el = document.getElementById(targetId);
                    el.src = e.target.result;
                    el.classList.remove('hidden');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function uploadData() {
            const po = document.getElementById('planSelector').value;
            if(!po) return alert('Select PO# first!');

            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = "UPLOADING TO HQ...";

            const payload = {
                po: po,
                style: document.getElementById('styleDesc').value,
                qty: document.getElementById('orderQty').value,
                defects: selectedDefects,
                sections: sectionStatus,
                time: new Date().toLocaleString('zh-CN', { hour12: false }),
                device: "Inspector-Pro-V6.1"
            };

            try {
                const res = await fetch(`https://api.npoint.io/${RESULT_ID}`);
                let current = [];
                try {
                    const json = await res.json();
                    if(Array.isArray(json)) current = json;
                } catch(e) {}

                current.unshift(payload);
                if(current.length > 50) current = current.slice(0, 50);

                const saveRes = await fetch(`https://api.npoint.io/${RESULT_ID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(current)
                });

                if(!saveRes.ok) throw new Error("Connection Lost");

                btn.innerText = "SUCCESSFULLY SYNCED ✓";
                btn.className = "w-full py-5 bg-green-600 text-white font-black rounded-2xl";
                alert('Inspection data finalized and pushed to HQ Cloud Buffer.');
                
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = "Finalize Inspection";
                    btn.className = "w-full py-5 bg-slate-900 text-white font-black rounded-2xl";
                }, 4000);

            } catch (e) {
                alert('CRITICAL SYNC ERROR: ' + e.message);
                btn.disabled = false;
                btn.innerText = "RETRY FINALIZATION";
            }
        }

        loadPlans();
    </script>
</body>
</html>

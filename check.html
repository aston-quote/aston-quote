<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ASTON Q.A. V4.16 - 极速版</title>
    <!-- 核心库异步化，防止卡死 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .photo-slot { aspect-ratio: 4/3; background: #f8fafc; border: 2px dashed #e2e8f0; border-radius: 1.5rem; display: flex; items-center; justify-content: center; position: relative; overflow: hidden; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
        .step-active { background: #1d4ed8 !important; color: white !important; border-radius: 999px; }
        .lang-zh .en { display: none; }
        .lang-en .zh { display: none; }
        .watermark-canvas { display: none; }
        input, select, textarea { outline: none; }
    </style>
    <script>
        // --- 核心逻辑抢先执行 ---
        var currentUser = '';
        var currentRole = '';
        var currentStep = 1;
        var inspectionData = { order: '', factory: '', gps: '', images: {}, defects: [] };
        var supabase = null;

        function login() {
            console.log('Login trigger');
            try {
                var id = document.getElementById('login-id').value;
                var role = document.getElementById('login-role').value;
                if (!id) return alert('请选择账号');
                
                currentUser = id;
                currentRole = role;
                
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('app-header').classList.remove('hidden');
                
                if (role === 'merchandiser' || role === 'manager') {
                    showMerchDashboard();
                } else {
                    showInspectorDashboard();
                }
                
                if (window.lucide) lucide.createIcons();
            } catch (e) {
                alert('登录脚本执行错误: ' + e.message);
            }
        }

        function showMerchDashboard() {
            document.getElementById('merch-view').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = currentUser;
            refreshAssignedTasks();
        }

        function showInspectorDashboard() {
            document.getElementById('inspector-view').classList.remove('hidden');
            document.getElementById('inspector-display-name').innerText = currentUser;
            refreshInspectorTasks();
        }

        function initApp() {
            var debug = document.getElementById('debug-info');
            if (debug) {
                debug.innerText = 'System Ready (V4.16)';
                debug.style.color = '#10b981';
            }
            // 尝试初始化 Supabase
            if (window.supabase) {
                try {
                    supabase = window.supabase.createClient('https://mrrtjetiincpovhedeql.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ycnRqZXRpaW5jcG92aGVkZXFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyODEwMzksImV4cCI6MjA5Mjg1NzAzOX0.VgCb6VJQKYeE_0nVRecZPtbxkGfzOU8MGiUoTf92uF4');
                    var el = document.getElementById('sync-status');
                    if (el) el.innerHTML = '<div class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></div> CLOUD LIVE';
                } catch(e) {}
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
        window.onload = initApp;
    </script>
</head>
<body id="main-body" class="bg-slate-50 text-slate-900 lang-zh">

    <!-- 1. Login View -->
    <div id="login-view" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-[100] p-6 overflow-y-auto">
        <div class="w-full max-w-md space-y-8 py-12">
            <div class="text-center text-white">
                <div class="w-20 h-20 bg-blue-600 rounded-3xl mx-auto flex items-center justify-center shadow-2xl shadow-blue-500/40 mb-6">
                    <i data-lucide="shield-check" class="w-10 h-10 text-white"></i>
                </div>
                <h2 class="text-3xl font-black tracking-tighter">ASTON Q.A.</h2>
                <p class="text-slate-400 text-sm mt-2 font-medium uppercase tracking-widest">Quality Assurance System V4.0</p>
            </div>

            <div class="bg-white/5 backdrop-blur-xl border border-white/10 p-8 rounded-[2.5rem] shadow-2xl space-y-6">
                <div id="debug-info" class="text-[8px] text-blue-400 font-mono text-center">System Initializing...</div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">用户账号 User ID</label>
                    <select id="login-id" class="w-full bg-slate-800 border-none p-4 text-white appearance-none rounded-2xl">
                        <option value="Merchandiser_Boss">跟单总监 (Boss)</option>
                        <option value="Inspector_Li">李检验员 (Li)</option>
                        <option value="Inspector_Zhang">张检验员 (Zhang)</option>
                        <option value="Inspector_Wang">王检验员 (Wang)</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">角色权限 Role</label>
                    <select id="login-role" class="w-full bg-slate-800 border-none p-4 text-white appearance-none rounded-2xl">
                        <option value="merchandiser">跟单员 (Merchandiser)</option>
                        <option value="inspector">检验员 (Inspector)</option>
                    </select>
                </div>
                <button onclick="login()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest shadow-xl shadow-blue-500/20 active:scale-95 transition-all">
                    进入系统 Login
                </button>
            </div>
        </div>
    </div>

    <!-- App Header -->
    <header id="app-header" class="bg-blue-700 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center hidden">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center font-black">A</div>
            <h1 class="font-black tracking-tighter text-lg">ASTON Q.A.</h1>
        </div>
        <div class="flex items-center gap-2">
            <div id="sync-status" class="flex items-center text-[8px] font-bold px-2 py-1 rounded bg-slate-800/50 text-slate-400">
                <div class="w-1.5 h-1.5 rounded-full bg-slate-500 mr-1.5"></div>
                LOCAL ONLY
            </div>
            <button onclick="location.reload()" class="text-xs bg-red-500/20 px-2 py-1 rounded">退出</button>
        </div>
    </header>

    <main id="app-content">
        <!-- Dashboard Views (Hidden by default) -->
        <div id="merch-view" class="p-4 space-y-4 hidden">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <h3 class="font-black text-gray-800 flex items-center mb-4">
                    指派任务 Assign Task (User: <span id="user-display-name">--</span>)
                </h3>
                <div class="grid grid-cols-2 gap-3">
                    <div class="col-span-2 bg-gray-50 p-3 rounded-2xl">
                        <label class="text-[10px] font-bold text-gray-400 uppercase">产品类型</label>
                        <select id="new-type" class="w-full bg-transparent border-none font-bold text-sm">
                            <option>大货成品 Bulk</option>
                            <option>外购成品 Outsourced</option>
                        </select>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-2xl">
                        <label class="text-[10px] font-bold text-gray-400 uppercase">订单号</label>
                        <input type="text" id="new-order-no" class="w-full bg-transparent border-none font-bold text-sm" placeholder="PO#">
                    </div>
                    <div class="bg-gray-50 p-3 rounded-2xl">
                        <label class="text-[10px] font-bold text-gray-400 uppercase">工厂</label>
                        <input type="text" id="new-factory" class="w-full bg-transparent border-none font-bold text-sm" placeholder="工厂">
                    </div>
                    <div class="col-span-2 bg-amber-50 p-3 rounded-2xl">
                        <label class="text-[10px] font-bold text-amber-600 uppercase">注意事项</label>
                        <textarea id="new-notes" class="w-full bg-transparent border-none font-medium text-xs h-12"></textarea>
                    </div>
                    <div class="col-span-2 bg-blue-50 p-3 rounded-2xl">
                        <label class="text-[10px] font-bold text-blue-600 uppercase">指派给</label>
                        <select id="assign-user" class="w-full bg-transparent border-none font-bold text-sm">
                            <option value="Inspector_Li">李检验员 (Li)</option>
                            <option value="Inspector_Zhang">张检验员 (Zhang)</option>
                        </select>
                    </div>
                </div>
                <button onclick="assignTask()" class="w-full mt-6 bg-blue-600 text-white py-4 rounded-2xl font-black uppercase shadow-lg">发送任务</button>
            </div>
            <div id="assigned-task-list" class="space-y-2"></div>
        </div>

        <div id="inspector-view" class="p-4 space-y-4 hidden">
            <h2 class="text-2xl font-black text-slate-800 px-2">我的任务 My Tasks - <span id="inspector-display-name">--</span></h2>
            <div id="inspector-task-list" class="space-y-4"></div>
        </div>

        <!-- Inspection Flow -->
        <div id="inspection-flow" class="hidden">
            <nav class="flex bg-white border-b sticky top-14 z-40 overflow-x-auto">
                <button onclick="switchStep(1)" class="nav-step flex-1 py-3 px-4 text-xs font-black step-active" id="nav-1">签到</button>
                <button onclick="switchStep(2)" class="nav-step flex-1 py-3 px-4 text-xs font-black text-gray-400" id="nav-2">抽样</button>
                <button onclick="switchStep(3)" class="nav-step flex-1 py-3 px-4 text-xs font-black text-gray-400" id="nav-3">拍照</button>
                <button onclick="switchStep(4)" class="nav-step flex-1 py-3 px-4 text-xs font-black text-gray-400" id="nav-4">检验</button>
                <button onclick="switchStep(5)" class="nav-step flex-1 py-3 px-4 text-xs font-black text-gray-400" id="nav-5">报告</button>
            </nav>
            <div class="p-4 pb-32">
                <section id="step-1" class="step-content">
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 space-y-4">
                        <h3 id="info-order" class="text-2xl font-black">--</h3>
                        <p id="info-factory" class="text-blue-600 font-bold">--</p>
                        <p id="gps-display" class="text-[10px] font-mono text-gray-400">GPS: 未定位</p>
                        <button onclick="getGPS()" class="w-full py-4 bg-slate-100 rounded-2xl font-bold">获取 GPS 定位</button>
                    </div>
                </section>
                <section id="step-2" class="step-content hidden">
                    <div class="bg-white rounded-3xl p-6 text-center space-y-4">
                        <h3 class="font-black">AQL 2.5 二级抽样</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="bg-slate-50 p-4 rounded-2xl"><p class="text-[8px] text-gray-400">抽样</p><p class="text-2xl font-black">80</p></div>
                            <div class="bg-slate-50 p-4 rounded-2xl"><p class="text-[8px] text-gray-400">允收</p><p class="text-2xl font-black text-emerald-500">5</p></div>
                        </div>
                    </div>
                </section>
                <section id="step-3" class="step-content hidden space-y-4">
                    <div class="bg-white rounded-3xl p-6 space-y-4">
                        <div class="flex justify-between items-center"><h4 class="font-black text-xs uppercase">G1: 平铺照</h4><button onclick="addPhotoSlot('g1-container')" class="text-[8px] bg-blue-50 text-blue-600 px-2 py-1 rounded-full font-bold">+ 增加</button></div>
                        <div class="grid grid-cols-3 gap-2" id="g1-container">
                            <div class="photo-slot"><input type="file" capture="camera" onchange="processImage(this, 'g1_1')" class="absolute inset-0 opacity-0 z-10"><img id="img-g1_1" class="hidden">正面</div>
                            <div class="photo-slot"><input type="file" capture="camera" onchange="processImage(this, 'g1_2')" class="absolute inset-0 opacity-0 z-10"><img id="img-g1_2" class="hidden">反面</div>
                        </div>
                    </div>
                </section>
                <section id="step-4" class="step-content hidden space-y-4">
                    <div class="bg-white rounded-3xl p-6 space-y-4">
                        <h4 class="font-black text-xs uppercase">疵点记录</h4>
                        <div id="defect-container" class="space-y-2"></div>
                        <button onclick="addDefectRow()" class="w-full py-4 border-2 border-dashed border-gray-100 text-blue-500 font-bold rounded-2xl text-xs">+ 增加缺陷项</button>
                    </div>
                </section>
                <section id="step-5" class="step-content hidden space-y-4">
                    <div id="report-canvas" class="bg-white p-6 shadow-xl text-[8px] space-y-4">
                        <h2 class="text-xl font-black border-b-2 border-black pb-2">INSPECTION REPORT</h2>
                        <div class="bg-slate-50 p-4 rounded-xl grid grid-cols-2 gap-2" id="report-header-info"></div>
                        <div id="report-photo-preview" class="grid grid-cols-3 gap-1"></div>
                        <img id="r-sig" class="h-16 mt-4 border-b">
                    </div>
                    <div class="bg-white p-6 rounded-3xl shadow-sm space-y-4">
                        <h3 class="font-black text-xs">手写签名</h3>
                        <canvas id="sig-pad" class="w-full h-32 bg-slate-50 border rounded-2xl"></canvas>
                        <button onclick="exportPDF()" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black uppercase">导出 PDF 报告</button>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <div id="nav-controls" class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t p-4 flex gap-4 z-50 hidden">
        <button onclick="prevStep()" class="flex-1 py-4 bg-gray-100 rounded-2xl font-bold text-gray-500 text-xs">上一步 BACK</button>
        <button onclick="nextStep()" class="flex-[2] py-4 bg-blue-600 text-white rounded-2xl font-black uppercase shadow-xl text-xs">下一步 NEXT</button>
    </div>

    <canvas id="watermarkCanvas" class="watermark-canvas"></canvas>

    <script>
        // --- 业务逻辑脚本 ---
        async function assignTask() {
            const task = {
                id: Date.now(),
                type: document.getElementById('new-type').value,
                order: document.getElementById('new-order-no').value,
                factory: document.getElementById('new-factory').value,
                notes: document.getElementById('new-notes').value,
                inspector: document.getElementById('assign-user').value,
                status: 'PENDING',
                creator: currentUser,
                created_at: new Date().toISOString()
            };
            if (!task.order || !task.factory) return alert('必填项缺失');
            if (supabase) await supabase.from('aston_tasks').insert([task]);
            const tasks = JSON.parse(localStorage.getItem('aston_tasks') || '[]');
            tasks.push(task);
            localStorage.setItem('aston_tasks', JSON.stringify(tasks));
            alert('已派发'); refreshAssignedTasks();
        }

        async function refreshAssignedTasks() {
            let tasks = [];
            if (supabase) {
                const { data } = await supabase.from('aston_tasks').select('*').eq('creator', currentUser).order('created_at', { ascending: false });
                if (data) tasks = data;
            } else {
                tasks = JSON.parse(localStorage.getItem('aston_tasks') || '[]').filter(t => t.creator === currentUser).reverse();
            }
            document.getElementById('assigned-task-list').innerHTML = tasks.map(t => `
                <div class="bg-white p-3 rounded-xl border text-[10px] flex justify-between">
                    <div><b>${t.order}</b><br>${t.factory}</div>
                    <span class="text-blue-600">${t.status}</span>
                </div>
            `).join('');
        }

        var currentTasks = [];
        async function refreshInspectorTasks() {
            let tasks = [];
            if (supabase) {
                const { data } = await supabase.from('aston_tasks').select('*').eq('inspector', currentUser).order('created_at', { ascending: false });
                if (data) tasks = data;
            } else {
                tasks = JSON.parse(localStorage.getItem('aston_tasks') || '[]').filter(t => t.inspector === currentUser).reverse();
            }
            currentTasks = tasks;
            document.getElementById('inspector-task-list').innerHTML = tasks.map((t, index) => `
                <div onclick="startInspectionByIndex(${index})" class="bg-white p-6 rounded-3xl shadow-sm border-l-4 border-emerald-500 active:scale-95">
                    <h4 class="font-black">${t.order}</h4>
                    <p class="text-xs text-gray-400">${t.factory}</p>
                </div>
            `).join('');
        }

        function startInspectionByIndex(idx) {
            const task = currentTasks[idx];
            inspectionData.task = task;
            inspectionData.order = task.order;
            inspectionData.factory = task.factory;
            document.getElementById('info-order').innerText = task.order;
            document.getElementById('info-factory').innerText = task.factory;
            document.getElementById('inspector-view').classList.add('hidden');
            document.getElementById('inspection-flow').classList.remove('hidden');
            document.getElementById('nav-controls').classList.remove('hidden');
            switchStep(1);
        }

        function switchStep(step) {
            document.querySelectorAll('.step-content').forEach(s => s.classList.add('hidden'));
            document.getElementById('step-'+step).classList.remove('hidden');
            document.querySelectorAll('.nav-step').forEach(n => { n.classList.remove('step-active'); n.classList.add('text-gray-400'); });
            document.getElementById('nav-'+step).classList.add('step-active');
            currentStep = step;
            if (step === 5) updateReport();
        }

        function nextStep() { if (currentStep < 5) switchStep(currentStep + 1); }
        function prevStep() { if (currentStep > 1) switchStep(currentStep - 1); }

        function getGPS() {
            navigator.geolocation.getCurrentPosition(pos => {
                inspectionData.gps = pos.coords.latitude.toFixed(4) + ", " + pos.coords.longitude.toFixed(4);
                document.getElementById('gps-display').innerText = "GPS: " + inspectionData.gps;
            });
        }

        function processImage(input, id) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const cvs = document.getElementById('watermarkCanvas');
                    const ctx = cvs.getContext('2d');
                    cvs.width = 800; cvs.height = 600;
                    ctx.drawImage(img, 0, 0, 800, 600);
                    ctx.fillStyle = "white"; ctx.font = "16px Arial";
                    ctx.fillText(inspectionData.order + " | " + inspectionData.gps, 20, 580);
                    const dataUrl = cvs.toDataURL('image/jpeg', 0.8);
                    document.getElementById('img-'+id).src = dataUrl;
                    document.getElementById('img-'+id).classList.remove('hidden');
                    inspectionData.images[id] = dataUrl;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }

        function addPhotoSlot(cId) {
            const id = 'ex_'+Date.now();
            const div = document.createElement('div'); div.className="photo-slot";
            div.innerHTML = `<input type="file" capture="camera" onchange="processImage(this, '${id}')" class="absolute inset-0 opacity-0 z-10"><img id="img-${id}" class="hidden">`;
            document.getElementById(cId).appendChild(div);
        }

        function addDefectRow() {
            const row = document.createElement('div'); row.className="p-3 bg-slate-50 rounded-xl flex gap-2";
            row.innerHTML = `<select class="flex-1 text-xs border-none bg-white p-2 rounded-lg"><option>色差 Shade</option><option>跳针 Skip</option></select><input type="number" class="w-16 p-2 rounded-lg border-none" placeholder="数量">`;
            document.getElementById('defect-container').appendChild(row);
        }

        function updateReport() {
            const t = inspectionData.task || {};
            document.getElementById('report-header-info').innerHTML = `<p>Order: ${t.order}</p><p>Factory: ${t.factory}</p><p>GPS: ${inspectionData.gps}</p>`;
            const prev = document.getElementById('report-photo-preview'); prev.innerHTML = '';
            Object.values(inspectionData.images).forEach(src => {
                const i = document.createElement('img'); i.src = src; i.className="w-full rounded border"; prev.appendChild(i);
            });
            document.getElementById('r-sig').src = sigPad.toDataURL();
        }

        function exportPDF() {
            html2canvas(document.getElementById('report-canvas')).then(cvs => {
                const pdf = new jspdf.jsPDF();
                pdf.addImage(cvs.toDataURL('image/jpeg'), 'JPEG', 0, 0, 210, 297);
                pdf.save('Report.pdf');
            });
        }

        var sigPad, sigCtx, drawing = false;
        function initSig() {
            sigPad = document.getElementById('sig-pad'); if(!sigPad) return;
            sigCtx = sigPad.getContext('2d');
            sigPad.width = sigPad.offsetWidth; sigPad.height = sigPad.offsetHeight;
            sigPad.addEventListener('mousedown', () => drawing = true);
            sigPad.addEventListener('mousemove', e => { if(drawing) sigCtx.lineTo(e.offsetX, e.offsetY); sigCtx.stroke(); });
            sigPad.addEventListener('mouseup', () => drawing = false);
            sigPad.addEventListener('touchstart', e => { drawing = true; sigCtx.beginPath(); });
            sigPad.addEventListener('touchmove', e => { if(drawing) { var r = sigPad.getBoundingClientRect(); sigCtx.lineTo(e.touches[0].clientX - r.left, e.touches[0].clientY - r.top); sigCtx.stroke(); e.preventDefault(); } });
            sigPad.addEventListener('touchend', () => drawing = false);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASTON 验货系统 v5.08</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg pb-20 text-slate-800">
        <header class="bg-slate-900 text-white p-4 sticky top-0 z-10 flex justify-between items-center shadow-md">
            <h1 class="text-lg font-black italic tracking-tighter">ASTON Q.A. <span class="text-blue-500">v5.08</span></h1>
            <div class="text-[9px] px-2 py-1 bg-slate-800 rounded border border-slate-700 font-mono text-green-400">STATUS: READY</div>
        </header>

        <!-- 表单区 -->
        <section class="p-5 space-y-4">
            <div class="bg-slate-50 p-6 rounded-3xl border border-slate-200 shadow-inner">
                <label class="block text-[10px] font-black text-slate-400 mb-2 tracking-widest uppercase">Order PO Number</label>
                <input type="text" id="poNumber" oninput="this.value = this.value.toUpperCase()" class="w-full bg-transparent text-3xl font-black focus:text-blue-600 outline-none transition-all placeholder:text-slate-200" placeholder="PO-2024">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                    <label class="block text-[9px] font-bold text-slate-300 uppercase mb-1">Style Name</label>
                    <input type="text" id="styleDesc" class="w-full text-sm font-bold outline-none" placeholder="T-Shirt">
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                    <label class="block text-[9px] font-bold text-slate-300 uppercase mb-1">Quantity</label>
                    <input type="number" id="orderQty" class="w-full text-sm font-bold outline-none" placeholder="1000">
                </div>
            </div>
        </section>

        <!-- 瑕疵勾选 -->
        <section class="px-5 pb-5">
            <h2 class="text-[10px] font-black text-slate-400 mb-3 tracking-widest uppercase flex items-center">
                <span class="w-4 h-[1px] bg-slate-200 mr-2"></span> Defect Checklist
            </h2>
            <div id="defectContainer" class="grid grid-cols-2 gap-2"></div>
        </section>

        <!-- 拍照区 -->
        <section class="px-5 pb-20">
            <h2 class="text-[10px] font-black text-slate-400 mb-3 tracking-widest uppercase flex items-center">
                <span class="w-4 h-[1px] bg-slate-200 mr-2"></span> Photos
            </h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="relative bg-slate-50 border-2 border-dashed border-slate-200 rounded-3xl aspect-square flex items-center justify-center overflow-hidden">
                    <input type="file" accept="image/*" capture="camera" class="absolute inset-0 opacity-0 z-10" onchange="previewImg(this, 'img1')">
                    <img id="img1" class="hidden absolute inset-0 w-full h-full object-cover">
                    <div class="text-center text-slate-300">
                        <div class="text-2xl mb-1">+</div>
                        <div class="text-[8px] font-bold uppercase">Gate Photo</div>
                    </div>
                </div>
                <div class="relative bg-slate-50 border-2 border-dashed border-slate-200 rounded-3xl aspect-square flex items-center justify-center overflow-hidden">
                    <input type="file" accept="image/*" capture="camera" class="absolute inset-0 opacity-0 z-10" onchange="previewImg(this, 'img2')">
                    <img id="img2" class="hidden absolute inset-0 w-full h-full object-cover">
                    <div class="text-center text-slate-300">
                        <div class="text-2xl mb-1">+</div>
                        <div class="text-[8px] font-bold uppercase">Main Defect</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 底部提交 -->
        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/80 backdrop-blur-md border-t border-slate-100 flex gap-3">
            <button id="btnSubmit" onclick="uploadData()" class="flex-1 py-4 bg-slate-900 text-white font-black rounded-2xl shadow-xl active:scale-95 transition-all text-sm tracking-widest">
                SYNC TO CLOUD
            </button>
        </div>
    </div>

    <script>
        // 核心 ID 锁定 (v5.08 强化版)
        const CLOUD_ID = "7d3635950e3968601676";
        const CLOUD_API = `https://api.npoint.io/${CLOUD_ID}`;
        
        const defects = ["Stains", "Skip Stitches", "Shading", "Open Seams", "Measurement", "Zipper Issue", "Loose Thread", "Packing", "Wrong Label", "Print Fault"];
        let selectedDefects = [];

        // 初始化界面
        const container = document.getElementById('defectContainer');
        defects.forEach(d => {
            const btn = document.createElement('button');
            btn.className = "p-3 text-[10px] font-bold bg-white border border-slate-100 rounded-xl text-slate-400 transition-all text-left flex justify-between items-center";
            btn.innerHTML = `<span>${d}</span><span class="w-2 h-2 rounded-full bg-slate-100"></span>`;
            btn.onclick = () => {
                const dot = btn.querySelector('span:last-child');
                if(selectedDefects.includes(d)) {
                    selectedDefects = selectedDefects.filter(i => i !== d);
                    btn.classList.remove('border-blue-500', 'text-blue-600');
                    dot.classList.replace('bg-blue-500', 'bg-slate-100');
                } else {
                    selectedDefects.push(d);
                    btn.classList.add('border-blue-500', 'text-blue-600');
                    dot.classList.replace('bg-slate-100', 'bg-blue-500');
                }
            };
            container.appendChild(btn);
        });

        function previewImg(input, targetId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    const el = document.getElementById(targetId);
                    el.src = e.target.result;
                    el.classList.remove('hidden');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function uploadData() {
            const po = document.getElementById('poNumber').value;
            if(!po) return alert('PO# Required!');

            const btn = document.getElementById('btnSubmit');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = "CONNECTING...";

            const payload = {
                po: po,
                style: document.getElementById('styleDesc').value || "Unnamed",
                qty: document.getElementById('orderQty').value || 0,
                defects: selectedDefects,
                time: new Date().toLocaleString('zh-CN', { hour12: false }),
                v: "5.08"
            };

            try {
                // 第一阶段：拉取
                btn.innerText = "PULLING...";
                let current = [];
                try {
                    const res = await fetch(CLOUD_API, { method: 'GET', cache: 'no-cache' });
                    if(res.ok) {
                        const contentType = res.headers.get('content-type');
                        if(contentType && contentType.includes('application/json')) {
                            const json = await res.json();
                            if(Array.isArray(json)) current = json;
                        }
                    }
                } catch(e) { console.warn("Fetch fail, start fresh"); }

                // 第二阶段：合并
                current.unshift(payload);
                if(current.length > 50) current = current.slice(0, 50); // 保留最新50条

                // 第三阶段：推送
                btn.innerText = "PUSHING...";
                const saveRes = await fetch(CLOUD_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(current)
                });

                if(!saveRes.ok) throw new Error(`Cloud Error (${saveRes.status})`);

                btn.innerText = "SYNCED ✓";
                btn.className = "flex-1 py-4 bg-green-600 text-white font-black rounded-2xl";
                alert('Success: Data uploaded to cloud buffer.');
                
                // 3秒后恢复
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = originalText;
                    btn.className = "flex-1 py-4 bg-slate-900 text-white font-black rounded-2xl shadow-xl active:scale-95 transition-all text-sm tracking-widest";
                }, 3000);

            } catch (e) {
                console.error(e);
                alert(`Sync Failed!\nReason: ${e.message}\n\nTips: Please check internet or wait a moment.`);
                btn.disabled = false;
                btn.innerText = "RETRY SYNC";
            }
        }
    </script>
</body>
</html>

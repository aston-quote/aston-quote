<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ASTON Q.A. V4.98 - 双云镜像对齐版</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f8fafc; }
        .hidden { display: none !important; }
        #login-view { position: fixed; inset: 0; background: #0f172a; z-index: 1000; display: flex; align-items: center; justify-content: center; color: white; padding: 20px; text-align: center; }
        .login-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 24px; width: 100%; max-width: 400px; }
        .btn-blue { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; }
        .input-dark { background: #1e293b; border: none; color: white; padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 15px; box-sizing: border-box; }
        .task-card { background: white; border-radius: 24px; border: 1px solid #e2e8f0; overflow: hidden; margin-bottom: 15px; }
        .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 9px; font-weight: 900; }
        .badge-red { background: #fee2e2; color: #ef4444; }
        .badge-green { background: #dcfce7; color: #10b981; }
        .badge-blue { background: #dbeafe; color: #2563eb; }
        .card-img-large { width: 90px; height: 90px; object-fit: cover; border-radius: 16px; border: 1px solid #e2e8f0; background: #000; }
        .label-sm { font-size: 10px; font-weight: 900; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; display: block; }
        #sync-status { font-size: 8px; font-weight: bold; color: #94a3b8; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .btn-action { font-size: 10px; font-weight: 900; padding: 8px 0; border-radius: 12px; text-align: center; flex: 1; }
        .date-line { font-size: 9px; font-weight: bold; color: #64748b; display: flex; align-items: center; gap: 4px; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body onload="autoInit()">

    <div id="login-view">
        <div class="login-card">
            <h2 style="font-size: 24px; font-weight: 900;">ASTON Q.A.</h2>
            <p style="font-size: 10px; color: #94a3b8; margin-bottom: 20px;">V4.98 Dual-Cloud Mirror (Final)</p>
            <select id="login-id" onchange="autoSetRole()" class="input-dark">
                <option value="">选择账号 Account</option>
                <option value="Merchandiser_Boss">跟单总监 (Boss)</option>
                <option value="Inspector_Li">李检验员 (Li)</option>
                <option value="Inspector_Zhang">张检验员 (Zhang)</option>
                <option value="Inspector_Wang">王检验员 (Wang)</option>
            </select>
            <select id="login-role" class="input-dark"><option value="merchandiser">跟单 (Merch)</option><option value="inspector">检验 (Insp)</option></select>
            <button onclick="login()" class="btn-blue">登录并同步 Login</button>
        </div>
    </div>

    <header id="app-header" class="bg-blue-700 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center hidden">
        <div>
            <h1 class="font-black text-lg">ASTON Q.A.</h1>
            <p id="sync-status">● 正在双云对齐中...</p>
        </div>
        <div class="flex gap-2">
            <button onclick="syncCloud()" class="bg-white text-blue-900 text-[10px] font-black px-3 py-1.5 rounded-full shadow-lg">🔄 强制全量对齐</button>
            <button onclick="location.reload()" class="text-xs bg-red-500/20 px-2 py-1 rounded">退出</button>
        </div>
    </header>

    <main id="app-content">
        <!-- 跟单员视图 -->
        <div id="merch-view" class="p-4 space-y-4 hidden">
            <div class="bg-white p-6 rounded-[2rem] border shadow-sm">
                <h3 class="font-black text-lg mb-4" id="form-title">下达检验计划</h3>
                <input type="hidden" id="editing-task-id">
                <div class="grid grid-cols-2 gap-3">
                    <div class="col-span-2 bg-slate-50 p-3 rounded-2xl"><label class="label-sm">订单 PO#</label><input id="new-order-no" class="w-full bg-transparent font-black text-sm" placeholder="PO编号"></div>
                    <div class="bg-slate-50 p-3 rounded-2xl"><label class="label-sm">款式描述 Style</label><input id="new-style-desc" class="w-full bg-transparent font-black text-sm" placeholder="款式名称"></div>
                    <div class="bg-slate-50 p-3 rounded-2xl"><label class="label-sm">订单数量 Qty</label><input type="number" id="new-order-qty" class="w-full bg-transparent font-black text-sm" placeholder="件数"></div>
                    <div class="bg-slate-50 p-3 rounded-2xl"><label class="label-sm">验货日期 Inspection</label><input type="date" id="new-inspection-date" class="w-full bg-transparent font-black text-sm"></div>
                    <div class="bg-slate-50 p-3 rounded-2xl"><label class="label-sm">交期日期 Delivery</label><input type="date" id="new-delivery-date" class="w-full bg-transparent font-black text-sm"></div>
                    <div class="col-span-2 bg-slate-50 p-3 rounded-2xl"><label class="label-sm">工厂 Factory</label><input id="new-factory" class="w-full bg-transparent font-black text-sm" placeholder="工厂名称"></div>
                    <div class="col-span-2 bg-slate-50 p-3 rounded-2xl"><label class="label-sm">备注 Notes</label><textarea id="new-special-notes" class="w-full bg-transparent font-bold text-xs h-16" placeholder="特殊说明..."></textarea></div>
                    <div class="col-span-2 bg-slate-100 p-3 rounded-2xl">
                        <label class="label-sm">样照预览 Styles (点 🔄 旋转 / 点 × 删除)</label>
                        <div id="merch-photo-container" class="grid grid-cols-2 gap-3 mt-2 min-h-[160px]"></div>
                        <button onclick="addMerchPhotoSlot()" class="w-full mt-3 py-3 border-dashed border-2 border-slate-300 rounded-xl text-[10px] font-black text-slate-500 bg-white shadow-inner">+ 增加照片 ADD PHOTO</button>
                    </div>
                    <div class="col-span-2 bg-blue-50 p-3 rounded-2xl"><label class="label-sm text-blue-600">指派检验员</label><select id="assign-user" class="w-full bg-transparent font-black text-sm"><option value="Inspector_Li">李检验员 (Li)</option><option value="Inspector_Zhang">张检验员 (Zhang)</option><option value="Inspector_Wang">王检验员 (Wang)</option></select></div>
                </div>
                <div class="flex gap-2 mt-6">
                    <button id="submit-btn" onclick="assignTask()" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg">发送计划并同步</button>
                    <button id="cancel-edit-btn" onclick="cancelEdit()" class="hidden bg-slate-200 text-slate-600 px-6 py-4 rounded-2xl font-black">取消</button>
                </div>
            </div>
            <div id="merch-task-list" class="space-y-4 pt-6"></div>
        </div>

        <!-- 检验员视图 -->
        <div id="inspector-view" class="p-4 space-y-4 hidden">
            <h2 class="text-xl font-black">我的任务 My Tasks</h2>
            <div id="inspector-task-list" class="space-y-4"></div>
        </div>

        <!-- 预览模态框 -->
        <div id="preview-modal" class="fixed inset-0 bg-black/80 z-[100] hidden flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-lg rounded-[2.5rem] overflow-hidden max-h-[90vh] flex flex-col">
                <div class="p-6 overflow-y-auto" id="preview-content"></div>
                <button onclick="closePreview()" class="m-6 bg-slate-900 text-white py-4 rounded-2xl font-black">关闭预览 Close</button>
            </div>
        </div>
    </main>

    <script>
        var currentUser = ''; var currentRole = ''; var referencePhotos = {};
        // 🚀 双引擎镜像：A 走 API 节点，B 走 KVDB 节点
        const ENGINE_A = "https://api.npoint.io/49899326e578f14c0a52";
        const ENGINE_B = "https://kvdb.io/S3VzQvD2m5yE9Z3pG6r7wX/aston_final_mirror";

        function autoSetRole() { const id = document.getElementById('login-id').value; document.getElementById('login-role').value = id.includes('Merch')?'merchandiser':'inspector'; }

        async function compressImage(base64Str, maxWidth = 300) {
            return new Promise(resolve => {
                const img = new Image(); img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height; if(w > maxWidth){ h *= maxWidth/w; w = maxWidth; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
                    resolve(canvas.toDataURL('image/jpeg', 0.4));
                };
            });
        }

        async function rotateImage(base64Str) {
            return new Promise(resolve => {
                const img = new Image(); img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.height; canvas.height = img.width;
                    const ctx = canvas.getContext('2d');
                    ctx.translate(canvas.width/2, canvas.height/2);
                    ctx.rotate(Math.PI / 2);
                    ctx.drawImage(img, -img.width/2, -img.height/2);
                    resolve(canvas.toDataURL('image/jpeg', 0.5));
                };
            });
        }

        async function autoInit() { await syncCloud(true); }

        function login() {
            currentUser = document.getElementById('login-id').value; currentRole = document.getElementById('login-role').value;
            if(!currentUser) return; document.getElementById('login-view').classList.add('hidden'); document.getElementById('app-header').classList.remove('hidden');
            if(currentRole==='merchandiser'){ document.getElementById('merch-view').classList.remove('hidden'); refreshMerchTasks(); }
            else { document.getElementById('inspector-view').classList.remove('hidden'); refreshInspectorTasks(); }
        }

        // 🚀 核心：双云镜像同步逻辑
        async function syncCloud(isSilent = false) {
            const status = document.getElementById('sync-status');
            if(!isSilent) status.innerText = "⏳ 正在跨云对齐...";
            
            let allTasks = [];
            
            // 1. 同时从两个云端尝试拉取数据
            const results = await Promise.allSettled([
                fetch(ENGINE_A + "?t=" + Date.now()).then(r => r.json()),
                fetch(ENGINE_B + "?t=" + Date.now()).then(r => r.json())
            ]);

            let cloudPool = [];
            results.forEach(res => {
                if(res.status === 'fulfilled') {
                    const data = res.value.tasks || res.value || [];
                    if(Array.isArray(data)) cloudPool = [...cloudPool, ...data];
                }
            });

            // 2. 合并云端与本地数据
            let localTasks = JSON.parse(localStorage.getItem('aston_tasks') || '[]');
            let mergedMap = new Map();

            // 合并逻辑：以 ID 为主键，保留 modified_at 最新的那份
            [...cloudPool, ...localTasks].forEach(t => {
                if(!t.id) return;
                const existing = mergedMap.get(t.id);
                if(!existing || (t.modified_at || 0) > (existing.modified_at || 0)) {
                    mergedMap.set(t.id, t);
                }
            });

            let finalTasks = Array.from(mergedMap.values()).filter(t => !t.isDeleted);
            localStorage.setItem('aston_tasks', JSON.stringify(finalTasks));

            // 3. 同时同步回两个云端（只要有一个通就行）
            Promise.allSettled([
                fetch(ENGINE_A, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tasks: finalTasks }) }),
                fetch(ENGINE_B, { method: 'PUT', body: JSON.stringify(finalTasks) })
            ]);

            status.innerHTML = `<span class="text-green-400 font-bold">● 双云镜像已对齐</span> ${new Date().toLocaleTimeString()}`;
            refreshMerchTasks(); refreshInspectorTasks();
        }

        async function assignTask() {
            const editingId = document.getElementById('editing-task-id').value;
            const t = { 
                id: editingId || 'T'+Date.now(), 
                order: document.getElementById('new-order-no').value, 
                factory: document.getElementById('new-factory').value, 
                inspector: document.getElementById('assign-user').value, 
                styleDesc: document.getElementById('new-style-desc').value, 
                orderQty: document.getElementById('new-order-qty').value,
                inspectionDate: document.getElementById('new-inspection-date').value, 
                deliveryDate: document.getElementById('new-delivery-date').value, 
                specialNotes: document.getElementById('new-special-notes').value, 
                referencePhotos: referencePhotos, 
                modified_at: Date.now(), 
                isDeleted: false 
            };
            if(!t.order) return alert('请填写 PO#');
            let ts = JSON.parse(localStorage.getItem('aston_tasks') || '[]');
            if(editingId) {
                const idx = ts.findIndex(x => x.id === editingId);
                if(idx !== -1) ts[idx] = t;
            } else {
                ts.push(t);
            }
            localStorage.setItem('aston_tasks', JSON.stringify(ts));
            await syncCloud(true);
            cancelEdit();
            alert('计划已保存，双云镜像实时同步中！');
            refreshMerchTasks();
        }

        function cancelEdit() {
            document.getElementById('editing-task-id').value = '';
            document.getElementById('new-order-no').value = '';
            document.getElementById('new-factory').value = '';
            document.getElementById('new-style-desc').value = '';
            document.getElementById('new-order-qty').value = '';
            document.getElementById('new-inspection-date').value = '';
            document.getElementById('new-delivery-date').value = '';
            document.getElementById('new-special-notes').value = '';
            referencePhotos = {};
            renderRefPhotos();
            document.getElementById('form-title').innerText = '下达检验计划';
            document.getElementById('submit-btn').innerText = '发送计划 SEND & SYNC';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function editTask(tid) {
            const ts = JSON.parse(localStorage.getItem('aston_tasks') || '[]');
            const t = ts.find(x => x.id === tid);
            if(!t) return;
            document.getElementById('editing-task-id').value = t.id;
            document.getElementById('new-order-no').value = t.order;
            document.getElementById('new-factory').value = t.factory;
            document.getElementById('new-style-desc').value = t.styleDesc || '';
            document.getElementById('new-order-qty').value = t.orderQty || '';
            document.getElementById('new-inspection-date').value = t.inspectionDate;
            document.getElementById('new-delivery-date').value = t.deliveryDate;
            document.getElementById('new-special-notes').value = t.specialNotes || '';
            referencePhotos = JSON.parse(JSON.stringify(t.referencePhotos || {}));
            renderRefPhotos();
            document.getElementById('form-title').innerText = '修改检验计划';
            document.getElementById('submit-btn').innerText = '保存修改 SAVE';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function copyTask(tid) {
            const ts = JSON.parse(localStorage.getItem('aston_tasks') || '[]');
            const t = ts.find(x => x.id === tid);
            if(!t) return;
            document.getElementById('new-order-no').value = t.order + '-复';
            document.getElementById('new-factory').value = t.factory;
            document.getElementById('new-style-desc').value = t.styleDesc || '';
            document.getElementById('new-order-qty').value = t.orderQty || '';
            document.getElementById('new-inspection-date').value = t.inspectionDate;
            document.getElementById('new-delivery-date').value = t.deliveryDate;
            document.getElementById('new-special-notes').value = t.specialNotes || '';
            referencePhotos = JSON.parse(JSON.stringify(t.referencePhotos || {}));
            renderRefPhotos();
            document.getElementById('form-title').innerText = '复制计划 (请修改PO#)';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function previewTask(tid) {
            const ts = JSON.parse(localStorage.getItem('aston_tasks') || '[]');
            const t = ts.find(x => x.id === tid);
            if(!t) return;
            const photoHtml = Object.values(t.referencePhotos || {}).map(src => `<img src="${src}" class="w-full rounded-xl mb-2">`).join('');
            document.getElementById('preview-content').innerHTML = `
                <div class="space-y-4 text-left">
                    <h2 class="text-2xl font-black border-b pb-2 text-blue-900">${t.order}</h2>
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div><p class="text-slate-400 font-bold text-[10px]">款式 Style</p><p class="font-black">${t.styleDesc || '--'}</p></div>
                        <div><p class="text-slate-400 font-bold text-[10px]">订单量 Qty</p><p class="font-black">${t.orderQty || '--'} 件</p></div>
                        <div><p class="text-slate-400 font-bold text-[10px]">验货日 Insp</p><p class="font-black">${t.inspectionDate}</p></div>
                        <div><p class="text-slate-400 font-bold text-[10px]">交期日 Deliv</p><p class="font-black">${t.deliveryDate}</p></div>
                    </div>
                    <div><p class="text-slate-400 font-bold text-[10px]">工厂 Factory</p><p class="font-black">${t.factory}</p></div>
                    <div class="bg-slate-50 p-4 rounded-2xl"><p class="text-slate-400 font-bold text-[10px] mb-1">备注说明 Notes</p><p class="text-xs font-bold">${t.specialNotes || '无'}</p></div>
                    <div class="grid grid-cols-2 gap-2">${photoHtml}</div>
                </div>
            `;
            document.getElementById('preview-modal').classList.remove('hidden');
        }

        function closePreview() { document.getElementById('preview-modal').classList.add('hidden'); }

        async function deleteTask(tid) {
            if(confirm('删除计划？云端镜像也将同步清除。')){ 
                let ts = JSON.parse(localStorage.getItem('aston_tasks')||'[]'); 
                const idx = ts.findIndex(x => x.id === tid);
                if(idx !== -1) { ts[idx].isDeleted = true; ts[idx].modified_at = Date.now(); localStorage.setItem('aston_tasks', JSON.stringify(ts)); } 
                await syncCloud(true);
                refreshMerchTasks(); 
            }
        }

        function getDaysDiff(d) { if(!d) return "--"; const today = new Date(); today.setHours(0,0,0,0); const target = new Date(d); target.setHours(0,0,0,0); return Math.ceil((target-today)/(86400000)); }
        function renderBadge(days, label) { 
            const cls = days < 0 ? 'badge-red' : (days <= 3 ? 'badge-blue' : 'badge-green'); 
            const text = days < 0 ? '逾 '+Math.abs(days) : '剩 '+days;
            return `<div class="badge ${cls}">${text}天</div>`; 
        }

        function refreshMerchTasks() {
            const ts = JSON.parse(localStorage.getItem('aston_tasks') || '[]').filter(t => !t.isDeleted).reverse();
            document.getElementById('merch-task-list').innerHTML = ts.map(t => {
                const photos = Object.values(t.referencePhotos || {});
                const firstPhoto = photos.length > 0 ? `<img src="${photos[0]}" class="card-img-large">` : '<div class="card-img-large flex items-center justify-center text-[10px] text-slate-400 font-black">无样照</div>';
                return `
                <div class="task-card p-5 border shadow-sm">
                    <div class="flex justify-between items-start mb-4">
                        <div><div class="font-black text-xl text-blue-900">${t.order}</div><div class="text-[10px] text-slate-400 font-black">${t.factory}</div></div>
                        <div class="text-right flex flex-col gap-1 items-end">
                            <div class="date-line">${t.inspectionDate} ${renderBadge(getDaysDiff(t.inspectionDate), '验')}</div>
                            <div class="date-line">${t.deliveryDate} ${renderBadge(getDaysDiff(t.deliveryDate), '交')}</div>
                        </div>
                    </div>
                    <div class="flex gap-4 items-center mb-4">
                        <div class="flex-1 space-y-3">
                            <div><span class="label-sm">款式 / 数量</span><div class="text-sm font-black text-slate-700 leading-tight">${t.styleDesc || '--'}<br>${t.orderQty || '--'} 件</div></div>
                        </div>
                        <div class="flex-shrink-0 relative">${firstPhoto}${photos.length > 1 ? `<div class="absolute -bottom-2 -right-2 bg-blue-600 text-white text-[8px] px-1.5 py-0.5 rounded-full font-black shadow-sm">+${photos.length-1}</div>` : ''}</div>
                    </div>
                    <div class="flex gap-2 pt-4 border-t">
                        <button onclick="previewTask('${t.id}')" class="btn-action bg-slate-100 text-slate-900">预览</button>
                        <button onclick="editTask('${t.id}')" class="btn-action bg-blue-50 text-blue-600">修改</button>
                        <button onclick="copyTask('${t.id}')" class="btn-action bg-green-50 text-green-600">复制</button>
                        <button onclick="deleteTask('${t.id}')" class="btn-action bg-red-50 text-red-600">删除</button>
                    </div>
                </div>`;
            }).join('');
        }

        function refreshInspectorTasks() {
            const ts = JSON.parse(localStorage.getItem('aston_tasks') || '[]').filter(t => t.inspector === currentUser && !t.isDeleted).reverse();
            document.getElementById('inspector-task-list').innerHTML = ts.map(t => {
                const photos = Object.values(t.referencePhotos || {});
                const firstPhoto = photos.length > 0 ? `<img src="${photos[0]}" class="card-img-large">` : '<div class="card-img-large flex items-center justify-center text-[10px] text-slate-400 font-black">无样照</div>';
                return `
                <div class="task-card p-5 border shadow-sm">
                    <div class="flex justify-between items-start mb-4">
                        <div><div class="font-black text-xl text-blue-900">${t.order}</div><div class="text-[10px] text-slate-400 font-black">${t.factory}</div></div>
                        <div class="text-right flex flex-col gap-1 items-end">
                            <div class="date-line">${t.inspectionDate} ${renderBadge(getDaysDiff(t.inspectionDate), '验')}</div>
                            <div class="date-line">${t.deliveryDate} ${renderBadge(getDaysDiff(t.deliveryDate), '交')}</div>
                        </div>
                    </div>
                    <div class="flex gap-4 items-center mb-4">
                        <div class="flex-1 space-y-3">
                            <div><span class="label-sm">款式 / 数量</span><div class="text-sm font-black text-slate-700 leading-tight">${t.styleDesc || '--'}<br>${t.orderQty || '--'} 件</div></div>
                        </div>
                        <div class="flex-shrink-0 relative">${firstPhoto}</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="previewTask('${t.id}')" class="w-24 py-4 bg-slate-100 text-slate-900 text-[10px] font-black rounded-2xl shadow-sm">详细预览</button>
                        <button class="flex-1 py-4 bg-blue-600 text-white text-[10px] font-black rounded-2xl shadow-md">开始检验 START</button>
                    </div>
                </div>`;
            }).join('');
        }

        async function processReferenceImage(input, id) { const r = new FileReader(); r.onload = async e => { const c = await compressImage(e.target.result); referencePhotos[id] = c; renderRefPhotos(); }; r.readAsDataURL(input.files[0]); }
        function renderRefPhotos() { 
            const container = document.getElementById('merch-photo-container'); 
            container.innerHTML = ''; 
            Object.entries(referencePhotos).forEach(([pid, src]) => { 
                const d = document.createElement('div'); 
                d.className="relative bg-black rounded-xl overflow-hidden shadow-sm"; 
                d.innerHTML = `<img src="${src}" class="w-full h-40 object-contain"><div class="absolute top-1 right-1 flex flex-col gap-1"><button onclick="rotateRefPhoto('${pid}')" class="bg-blue-600 text-white rounded-full w-8 h-8 text-[16px] flex items-center justify-center font-bold shadow-lg">🔄</button><button onclick="deleteRefPhoto('${pid}')" class="bg-red-600 text-white rounded-full w-8 h-8 text-[16px] flex items-center justify-center font-bold shadow-lg">×</button></div>`; 
                container.appendChild(d); 
            }); 
        }
        function addMerchPhotoSlot() { const id = 'ref_'+Date.now(); const input = document.createElement('input'); input.type='file'; input.accept='image/*'; input.onchange = (e) => processReferenceImage(e.target, id); input.click(); }
        function deleteRefPhoto(id){ delete referencePhotos[id]; renderRefPhotos(); }
        async function rotateRefPhoto(id) { referencePhotos[id] = await rotateImage(referencePhotos[id]); renderRefPhotos(); }
    </script>
</body>
</html>

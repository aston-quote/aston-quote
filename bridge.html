<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTON 数据搬运控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 space-y-6">
        <div class="text-center">
            <div class="inline-block p-3 bg-blue-100 rounded-full mb-4">
                <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">ASTON 数据中转站</h1>
            <p class="text-slate-500 text-sm mt-2">将公网验货记录搬运至本地私有 NAS</p>
        </div>

        <div class="bg-slate-50 rounded-2xl p-4 space-y-3 border border-slate-100">
            <div class="flex justify-between text-xs">
                <span class="text-slate-400 font-medium">公网源 (npoint)</span>
                <span class="text-green-500 font-bold">● 在线</span>
            </div>
            <div class="flex justify-between text-xs">
                <span class="text-slate-400 font-medium">目标 NAS</span>
                <span id="nasStatus" class="text-slate-500 font-bold italic">待检测...</span>
            </div>
        </div>

        <div class="space-y-4">
            <div class="text-xs text-slate-400 px-1">NAS 接收接口地址:</div>
            <input type="text" id="nasUrl" value="http://192.168.81.171/aston_qa/receive_data.php" 
                   class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button id="btnSync" onclick="startTransfer()" 
                class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-lg shadow-blue-200 transition-all active:scale-95 flex items-center justify-center space-x-2">
            <span>立即执行搬运</span>
        </button>

        <div id="log" class="text-[10px] font-mono text-slate-400 text-center min-h-[1.5rem]">
            准备就绪，点击上方按钮开始
        </div>

        <div class="pt-4 border-t border-slate-100 flex justify-between items-center px-2">
            <span class="text-[10px] text-slate-300 italic uppercase">ASTON Private Cloud v5.02</span>
            <a href="https://aston-quote.github.io/aston-quote/order_plan.html" class="text-[10px] text-blue-400 hover:underline">返回下单计划</a>
        </div>
    </div>

    <script>
        const CLOUD_API = "https://api.npoint.io/e2f3d3c8c4e5b9d2a1f0";
        
        async function startTransfer() {
            const btn = document.getElementById('btnSync');
            const log = document.getElementById('log');
            const nasUrl = document.getElementById('nasUrl').value;
            const nasStatus = document.getElementById('nasStatus');

            btn.disabled = true;
            btn.classList.add('opacity-50');
            log.innerHTML = "正在从公网提取数据...";

            try {
                // 1. 从公网拉取
                const res = await fetch(CLOUD_API);
                const data = await res.json();
                
                log.innerHTML = `已提取 ${Array.isArray(data) ? data.length : 0} 条记录，正在推送到 NAS...`;

                // 2. 推送到本地 NAS
                const postRes = await fetch(nasUrl, {
                    method: 'POST',
                    mode: 'cors',
                    body: JSON.stringify(data)
                });
                
                const result = await postRes.json();

                if(result.status === 'success') {
                    log.innerHTML = "<span class='text-green-500 font-bold'>恭喜！搬运成功。</span>";
                    nasStatus.innerHTML = "● 连接正常";
                    nasStatus.className = "text-green-500 font-bold";
                    alert('搬运成功！所有验货数据已安全存入您的群晖。');
                } else {
                    throw new Error(result.message);
                }
            } catch (e) {
                log.innerHTML = `<span class='text-red-400 font-bold'>失败: ${e.message}</span>`;
                nasStatus.innerHTML = "○ 连接失败";
                nasStatus.className = "text-red-400 font-bold";
                alert('搬运失败！\n\n请确认：\n1. 您的电脑能访问 ' + nasUrl + '\n2. 群晖的 receive_data.php 已创建并给好权限');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>

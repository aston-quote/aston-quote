<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASTON 验货系统 v5.03</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg pb-20">
        <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 flex justify-between items-center">
            <h1 class="text-lg font-bold italic">ASTON Q.A. v5.03</h1>
            <div id="syncStatus" class="text-[10px] px-2 py-1 bg-blue-700 rounded italic">云端就绪</div>
        </header>

        <section class="p-4 space-y-4">
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                <label class="block text-xs font-bold text-blue-800 mb-1 uppercase">Order PO# (Required)</label>
                <input type="text" id="poNumber" oninput="this.value = this.value.toUpperCase()" class="w-full p-3 border-2 border-blue-200 rounded-lg text-xl font-bold focus:border-blue-500 outline-none" placeholder="E.G. PO24001">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Style/Description</label>
                    <input type="text" id="styleDesc" class="w-full p-2 border rounded-lg" placeholder="Baby Play">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 mb-1">Quantity</label>
                    <input type="number" id="orderQty" class="w-full p-2 border rounded-lg" placeholder="1000">
                </div>
            </div>
        </section>

        <section class="p-4">
            <h2 class="font-bold mb-3 text-gray-800 flex items-center text-sm">
                <span class="w-1 h-4 bg-blue-600 mr-2 rounded"></span> DEFECT CHECKLIST
            </h2>
            <div id="defectContainer" class="grid grid-cols-2 gap-2"></div>
        </section>

        <section class="p-4 pb-10">
            <h2 class="font-bold mb-3 text-gray-800 flex items-center text-sm">
                <span class="w-1 h-4 bg-blue-600 mr-2 rounded"></span> PHOTOS
            </h2>
            <div class="grid grid-cols-3 gap-2">
                <div class="relative bg-gray-50 border-2 border-dashed border-gray-200 rounded-xl aspect-square flex items-center justify-center overflow-hidden">
                    <input type="file" accept="image/*" capture="camera" class="absolute inset-0 opacity-0 z-10" onchange="previewImg(this, 'img1')">
                    <img id="img1" class="hidden absolute inset-0 w-full h-full object-cover">
                    <span class="text-gray-400 text-[10px]">Photo 1</span>
                </div>
                <div class="relative bg-gray-50 border-2 border-dashed border-gray-200 rounded-xl aspect-square flex items-center justify-center overflow-hidden">
                    <input type="file" accept="image/*" capture="camera" class="absolute inset-0 opacity-0 z-10" onchange="previewImg(this, 'img2')">
                    <img id="img2" class="hidden absolute inset-0 w-full h-full object-cover">
                    <span class="text-gray-400 text-[10px]">Photo 2</span>
                </div>
                <div class="relative bg-gray-50 border-2 border-dashed border-gray-200 rounded-xl aspect-square flex items-center justify-center overflow-hidden">
                    <input type="file" accept="image/*" capture="camera" class="absolute inset-0 opacity-0 z-10" onchange="previewImg(this, 'img3')">
                    <img id="img3" class="hidden absolute inset-0 w-full h-full object-cover">
                    <span class="text-gray-400 text-[10px]">Photo 3</span>
                </div>
            </div>
        </section>

        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white/80 backdrop-blur-md border-t flex gap-3">
            <button id="btnSubmit" onclick="uploadData()" class="w-full py-4 bg-blue-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition-all">
                SUBMIT & SYNC
            </button>
        </div>
    </div>

    <script>
        const CLOUD_API = "https://api.npoint.io/02c3a505151520111999";
        const defects = ["Stains", "Skip Stitches", "Shading", "Open Seams", "Measurement", "Zipper Issue", "Loose Thread", "Packing", "Wrong Label", "Print Fault"];
        let selectedDefects = [];

        const container = document.getElementById('defectContainer');
        defects.forEach(d => {
            const btn = document.createElement('button');
            btn.className = "p-2 text-xs border rounded-lg bg-white text-gray-500 transition-colors";
            btn.innerText = d;
            btn.onclick = () => {
                btn.classList.toggle('bg-blue-600');
                btn.classList.toggle('text-white');
                btn.classList.toggle('border-blue-600');
                if(selectedDefects.includes(d)) selectedDefects = selectedDefects.filter(i => i !== d);
                else selectedDefects.push(d);
            };
            container.appendChild(btn);
        });

        function previewImg(input, targetId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById(targetId).src = e.target.result;
                    document.getElementById(targetId).classList.remove('hidden');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function uploadData() {
            const po = document.getElementById('poNumber').value;
            if(!po) return alert('PO# Required!');

            const btn = document.getElementById('btnSubmit');
            const status = document.getElementById('syncStatus');
            btn.disabled = true;
            btn.innerText = "Syncing...";

            const data = {
                po: po,
                style: document.getElementById('styleDesc').value,
                qty: document.getElementById('orderQty').value,
                defects: selectedDefects,
                time: new Date().toLocaleString()
            };

            try {
                const res = await fetch(CLOUD_API);
                let cloudData = await res.json();
                if(!Array.isArray(cloudData)) cloudData = [];
                cloudData.unshift(data);
                
                await fetch(CLOUD_API, {
                    method: 'POST',
                    body: JSON.stringify(cloudData)
                });

                status.innerText = "DONE";
                status.className = "text-[10px] px-2 py-1 bg-green-600 text-white rounded italic";
                alert('Synced Successfully!');
                btn.innerText = "SUBMITTED";
                btn.className = "w-full py-4 bg-green-600 text-white font-bold rounded-2xl";
            } catch (e) {
                alert('Sync Failed! Please try again.');
                btn.disabled = false;
                btn.innerText = "RETRY";
            }
        }
    </script>
</body>
</html>

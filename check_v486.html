<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Force Deploy: 2026-05-04 19:10 -->
    <title>ASTON Q.A. V4.86 - 稳定同步最终版</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f8fafc; }
        .hidden { display: none !important; }
        #login-view { position: fixed; inset: 0; background: #0f172a; z-index: 1000; display: flex; align-items: center; justify-content: center; color: white; padding: 20px; text-align: center; }
        .login-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 24px; width: 100%; max-width: 400px; }
        .btn-blue { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; }
        .input-dark { background: #1e293b; border: none; color: white; padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 15px; box-sizing: border-box; }
        .photo-slot { aspect-ratio: 4/3; background: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 16px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .photo-slot img { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .step-nav-btn { flex: 1; padding: 10px 5px; font-size: 10px; font-weight: 900; background: white; border: none; border-bottom: 2px solid transparent; transition: all 0.3s; }
        .step-active { background: #1d4ed8 !important; color: white !important; }
        .task-card { background: white; border-radius: 24px; border: 1px solid #e2e8f0; overflow: hidden; margin-bottom: 15px; transition: all 0.2s; }
        #sig-pad { touch-action: none; cursor: crosshair; }
        #preview-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; padding: 20px; overflow-y: auto; }
        .preview-content { background: white; border-radius: 2rem; max-width: 600px; margin: auto; padding: 30px; position: relative; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 900; }
        .badge-red { background: #fee2e2; color: #ef4444; }
        .badge-green { background: #dcfce7; color: #10b981; }
        .badge-blue { background: #dbeafe; color: #2563eb; }
        .card-img { width: 60px; height: 60px; object-fit: cover; border-radius: 12px; border: 1px solid #e2e8f0; background: #000; }
        .label-sm { font-size: 10px; font-weight: 900; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; display: block; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <div id="login-view">
        <div class="login-card">
            <h2 style="font-size: 24px; font-weight: 900;">ASTON Q.A.</h2>
            <p style="font-size: 10px; color: #94a3b8; margin-bottom: 20px;">V4.86 Stable Sync Version</p>
            <select id="login-id" onchange="autoSetRole()" class="input-dark">
                <option value="">请选择账号 Select Account</option>
                <option value="Merchandiser_Boss">跟单总监 (Boss)</option>
                <option value="Inspector_Li">李检验员 (Li)</option>
                <option value="Inspector_Zhang">张检验员 (Zhang)</option>
                <option value="Inspector_Wang">王检验员 (Wang)</option>
            </select>
            <select id="login-role" class="input-dark"><option value="merchandiser">跟单员 (Merchandiser)</option><option value="inspector">检验员 (Inspector)</option></select>
            <button onclick="login()" class="btn-blue">进入 Login</button>
        </div>
    </div>

    <header id="app-header" class="bg-blue-700 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center hidden">
        <h1 class="font-black text-lg">ASTON Q.A.</h1>
        <div class="flex gap-2">
            <button id="sync-btn" onclick="syncCloud()" class="bg-yellow-400 text-blue-900 text-[10px] font-black px-2 py-1 rounded shadow-lg">☁️ 云同步 SYNC</button>
            <button onclick="location.reload()" class="text-xs bg-red-500/20 px-2 py-1 rounded">退出</button>
        </div>
    </header>

    <main id="app-content">
        <div id="merch-view" class="p-4 space-y-4 hidden">
            <div class="bg-white p-6 rounded-[2rem] border shadow-sm">
                <h3 id="form-title" class="font-black text-lg mb-6">下达检验计划</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div class="col-span-2 bg-slate-50 p-3 rounded-2xl"><label class="label-sm">产品类型 Type</label><select id="new-type" class="w-full bg-transparent font-black text-sm"><option>1.大货成品 Bulk</option><option>2.外购成品 Outsourced</option><option>3.外购面料 Fabric</option><option>4.外购辅料 Trims</option></select></div>
                    <div class="bg-slate-50 p-3 rounded-2xl"><label class="label-sm">订单 PO#</label><input id="new-order-no" class="w-full bg-transparent font-black text-sm"></div>
                    <div class="bg-slate-50 p-3 rounded-2xl"><label class="label-sm">数量 Qty</label><input type="number" id="new-qty" class="w-full bg-transparent font-black text-sm"></div>
                    <div class="bg-slate-50 p-3 rounded-2xl"><label class="label-sm">工厂 Factory</label><input id="new-factory" class="w-full bg-transparent font-black text-sm"></div>
                    <div class="bg-slate-50 p-3 rounded-2xl"><label class="label-sm">款式描述 Style Desc</label><input id="new-style-desc" class="w-full bg-transparent font-black text-sm"></div>
                    <div class="bg-slate-50 p-3 rounded-2xl"><label class="label-sm">验货日期 Inspection</label><input type="date" id="new-inspection-date" class="w-full bg-transparent font-black text-sm"></div>
                    <div class="bg-slate-50 p-3 rounded-2xl"><label class="label-sm">交期日期 Delivery</label><input type="date" id="new-delivery-date" class="w-full bg-transparent font-black text-sm"></div>
                    <div class="col-span-2 bg-slate-50 p-3 rounded-2xl"><label class="label-sm">特殊备注 Notes</label><textarea id="new-special-notes" class="w-full bg-transparent font-bold text-xs h-16"></textarea></div>
                    <div class="col-span-2 bg-slate-50 p-3 rounded-2xl"><label class="label-sm">样照 Style Photos</label><div id="merch-photo-container" class="grid grid-cols-3 gap-2 mt-2"></div><button onclick="addMerchPhotoSlot()" class="w-full mt-2 py-2 border-2 border-dashed rounded-xl text-[10px] font-black">+ 增加样照</button></div>
                    <div class="col-span-2 bg-blue-50 p-3 rounded-2xl"><label class="label-sm text-blue-600">指派检验员 Inspector</label><select id="assign-user" class="w-full bg-transparent font-black text-sm"><option value="Inspector_Li">李检验员 (Li)</option><option value="Inspector_Zhang">张检验员 (Zhang)</option><option value="Inspector_Wang">王检验员 (Wang)</option></select></div>
                </div>
                <button id="send-btn" onclick="assignTask()" class="w-full mt-6 bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg">发送计划 SEND PLAN</button>
            </div>
            <div id="merch-task-list" class="space-y-4 pt-6"></div>
        </div>

        <div id="inspector-view" class="p-4 space-y-4 hidden">
            <h2 class="text-xl font-black">我的任务 My Tasks</h2>
            <div id="inspector-task-list" class="space-y-4"></div>
        </div>

        <div id="inspection-flow" class="hidden">
            <nav class="flex bg-white border-b sticky top-14 z-40 overflow-x-auto no-scrollbar"><button onclick="switchStep(1)" class="step-nav-btn step-active" id="nav-1">1. 签到</button><button onclick="switchStep(7)" class="step-nav-btn" id="nav-7">7. 报告</button></nav>
            <div class="p-4 pb-32"><section id="step-1" class="step-content pt-10 text-center space-y-4"><h3 class="text-2xl font-black">工厂签到</h3><div class="photo-slot border-blue-200"><input type="file" capture="camera" onchange="processImage(this, 'g0_gate', '大门')" class="absolute inset-0 opacity-0 z-10"><img id="img-g0_gate" class="hidden">拍照</div><button onclick="getGPS()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black">GPS 签到</button><p id="gps-display" class="text-[10px] font-mono">未定位</p></section></div>
        </div>
    </main>

    <div id="preview-modal" onclick="closePreview()"><div class="preview-content" onclick="event.stopPropagation()"><h3 class="font-black mb-4">资料预览 PREVIEW</h3><div id="preview-data" class="space-y-3 text-xs"></div><button onclick="closePreview()" class="w-full mt-6 py-4 bg-black text-white rounded-2xl font-black">关闭</button></div></div>

    <script>
        var currentUser = ''; var currentRole = ''; var currentStep = 1;
        var inspectionData = { task: null, images: {}, imageNames: {}, defects: [] };
        var referencePhotos = {}; var editTaskId = null;
        
        // 🚀 稳定云端配置 (使用专属存储桶)
        const CLOUD_TOKEN = "ASTON_QA_V486_GROUP"; 
        const CLOUD_URL = `https://jsonblob.com/api/jsonBlob/1368157774136614912`; // 使用固定 Blob ID

        function autoSetRole() { const id = document.getElementById('login-id').value; document.getElementById('login-role').value = id.includes('Merch')?'merchandiser':'inspector'; }

        async function compressImage(base64Str, maxWidth = 500) {
            return new Promise(resolve => {
                const img = new Image(); img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height; if(w > maxWidth){ h *= maxWidth/w; w = maxWidth; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
                    resolve(canvas.toDataURL('image/jpeg', 0.5));
                };
            });
        }

        function login() {
            currentUser = document.getElementById('login-id').value; currentRole = document.getElementById('login-role').value;
            if(!currentUser) return; document.getElementById('login-view').classList.add('hidden'); document.getElementById('app-header').classList.remove('hidden');
            if(currentRole==='merchandiser'){ document.getElementById('merch-view').classList.remove('hidden'); refreshMerchTasks(); }
            else { document.getElementById('inspector-view').classList.remove('hidden'); refreshInspectorTasks(); }
        }

        // 🚀 稳定同步逻辑 (最后修改优先 + 软删除支持)
        async function syncCloud() {
            const btn = document.getElementById('sync-btn'); btn.innerText = "⏳ 读取云端...";
            try {
                // 1. 读取云端
                const getRes = await fetch(CLOUD_URL);
                const cloudTasks = getRes.ok ? await getRes.json() : [];
                
                // 2. 读取本地
                let localTasks = JSON.parse(localStorage.getItem('aston_tasks') || '[]');
                
                // 3. 智能合并
                let merged = [...cloudTasks];
                localTasks.forEach(lt => {
                    const idx = merged.findIndex(ct => ct.id === lt.id);
                    if (idx === -1) merged.push(lt);
                    else if (lt.modified_at > (merged[idx].modified_at || 0)) merged[idx] = lt;
                });

                // 4. 应用软删除并过滤
                merged = merged.filter(t => !t.isDeleted);

                // 5. 写回云端
                btn.innerText = "⏳ 上传更新...";
                await fetch(CLOUD_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(merged)
                });

                // 6. 更新本地
                localStorage.setItem('aston_tasks', JSON.stringify(merged));
                alert("✅ 同步成功！数据已对齐。\nSync Finished!");
                refreshMerchTasks(); refreshInspectorTasks();
            } catch(e) { 
                alert("❌ 同步超时或失败，请检查手机网络。\nSync Failed."); 
            } finally { 
                btn.innerText = "☁️ 云同步 SYNC"; 
            }
        }

        function assignTask() {
            const t = {
                id: editTaskId || 'T'+Date.now(), type: document.getElementById('new-type').value,
                order: document.getElementById('new-order-no').value, factory: document.getElementById('new-factory').value,
                qty: document.getElementById('new-qty').value, inspector: document.getElementById('assign-user').value,
                styleDesc: document.getElementById('new-style-desc').value, inspectionDate: document.getElementById('new-inspection-date').value,
                deliveryDate: document.getElementById('new-delivery-date').value, specialNotes: document.getElementById('new-special-notes').value,
                referencePhotos: referencePhotos, modified_at: Date.now(), isDeleted: false
            };
            if(!t.order) return alert('PO# Required');
            let ts = JSON.parse(localStorage.getItem('aston_tasks') || '[]');
            const idx = ts.findIndex(x => x.id === t.id);
            if(idx !== -1) ts[idx] = t; else ts.push(t);
            localStorage.setItem('aston_tasks', JSON.stringify(ts));
            alert('本地已保存，请点击上方“云同步”发送到手机。');
            refreshMerchTasks();
        }

        function getDaysDiff(d) { if(!d) return "--"; const today = new Date(); today.setHours(0,0,0,0); const target = new Date(d); target.setHours(0,0,0,0); return Math.ceil((target-today)/(86400000)); }
        function renderBadge(days, label) { 
            const cls = days < 0 ? 'badge-red' : (days <= 3 ? 'badge-blue' : 'badge-green'); 
            const text = days < 0 ? '逾期 '+Math.abs(days) : '剩余 '+days;
            return `<div class="badge ${cls}">${label}: ${text}天</div>`; 
        }

        function refreshMerchTasks() {
            const ts = JSON.parse(localStorage.getItem('aston_tasks') || '[]').reverse();
            document.getElementById('merch-task-list').innerHTML = ts.map(t => {
                const photoHtml = Object.values(t.referencePhotos || {}).map(src => `<img src="${src}" class="card-img">`).join('');
                return `<div class="task-card p-5 border"><div class="flex justify-between mb-3"><div><div class="font-black text-lg">${t.order}</div><div class="text-[10px] text-slate-400">${t.factory}</div></div><div class="text-right">${renderBadge(getDaysDiff(t.inspectionDate), '验货')}<br>${renderBadge(getDaysDiff(t.deliveryDate), '交期')}</div></div><div class="flex gap-1 overflow-x-auto no-scrollbar py-2">${photoHtml}</div><div class="flex gap-2 pt-3 border-t"><button onclick="previewTask('${t.id}')" class="flex-1 py-2 bg-slate-100 text-[10px] font-black rounded-lg">预览</button><button onclick="deleteTask('${t.id}')" class="flex-1 py-2 bg-red-50 text-red-600 text-[10px] font-black rounded-lg">删除</button></div></div>`;
            }).join('');
        }

        function refreshInspectorTasks() {
            const ts = JSON.parse(localStorage.getItem('aston_tasks') || '[]').filter(t => t.inspector === currentUser).reverse();
            document.getElementById('inspector-task-list').innerHTML = ts.map(t => {
                const photoHtml = Object.values(t.referencePhotos || {}).map(src => `<img src="${src}" class="card-img">`).join('');
                return `<div class="task-card p-5 border"><div class="flex justify-between mb-2"><div><div class="font-black text-lg">${t.order}</div><div class="text-[10px] text-slate-400">${t.factory}</div></div><div class="text-right">${renderBadge(getDaysDiff(t.inspectionDate), '验货')}<br>${renderBadge(getDaysDiff(t.deliveryDate), '交期')}</div></div><div class="p-3 bg-slate-50 rounded-xl mb-3"><div class="text-[10px] font-black text-slate-400">款式描述 / STYLE DESC</div><div class="text-xs font-black text-slate-700">${t.styleDesc || '未填写'}</div><div class="mt-2 text-[10px] font-black text-slate-500">验货: ${t.inspectionDate} | 交货: ${t.deliveryDate}</div></div><div class="flex gap-1 overflow-x-auto no-scrollbar py-2 mb-3">${photoHtml}</div><div class="flex gap-2"><button onclick="previewTask('${t.id}')" class="flex-1 py-3 bg-slate-900 text-white text-[10px] font-black rounded-xl">预览</button><button onclick="startInspection('${t.id}')" class="flex-1 py-3 bg-blue-600 text-white text-[10px] font-black rounded-xl">开始检验</button></div></div>`;
            }).join('');
        }

        function deleteTask(tid) { 
            if(confirm('删除计划?')){ 
                let ts = JSON.parse(localStorage.getItem('aston_tasks')||'[]'); 
                const idx = ts.findIndex(x => x.id === tid);
                if(idx !== -1) { 
                    ts[idx].isDeleted = true; // 软删除标记
                    ts[idx].modified_at = Date.now();
                    localStorage.setItem('aston_tasks', JSON.stringify(ts));
                }
                alert("本地已删除，点击“云同步”生效到所有设备。");
                refreshMerchTasks(); 
            } 
        }

        function previewTask(tid) {
            const t = JSON.parse(localStorage.getItem('aston_tasks') || '[]').find(x => x.id===tid);
            if(!t) return;
            document.getElementById('preview-data').innerHTML = `<div class="grid grid-cols-2 gap-2"><div class="col-span-2 p-2 bg-slate-50">PO#: ${t.order}</div><div class="p-2 bg-slate-50">数量: ${t.qty}</div><div class="p-2 bg-slate-50">描述: ${t.styleDesc}</div><div class="col-span-2 p-2 bg-slate-50">备注: ${t.specialNotes || '-'}</div></div><div class="grid grid-cols-3 gap-2 mt-4">${Object.values(t.referencePhotos||{}).map(src => `<img src="${src}" class="w-full h-24 object-cover rounded">`).join('')}</div>`;
            document.getElementById('preview-modal').style.display = 'flex';
        }
        function closePreview(){ document.getElementById('preview-modal').style.display='none'; }
        function processImage(input, id, name) { /* 同前逻辑 */ }
        function addMerchPhotoSlot() { const id = 'ref_'+Date.now(); const input = document.createElement('input'); input.type='file'; input.accept='image/*'; input.onchange = (e) => processReferenceImage(e.target, id); input.click(); }
        function renderRefPhotos() { /* 同前逻辑 */ }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ASTON Q.A. PRO - 专业回归版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f8fafc; }
        .hidden { display: none !important; }
        #login-view { position: fixed; inset: 0; background: #0f172a; z-index: 1000; display: flex; align-items: center; justify-content: center; color: white; padding: 20px; text-align: center; }
        .login-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 30px; border-radius: 24px; width: 100%; max-width: 400px; }
        .btn-blue { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; }
        .input-dark { background: #1e293b; border: none; color: white; padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 15px; box-sizing: border-box; }
        .task-card { background: white; border-radius: 24px; border: 1px solid #e2e8f0; overflow: hidden; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .step-nav-btn { flex: 0 0 70px; padding: 10px 0; font-size: 8px; font-weight: 900; background: white; color: #94a3b8; border-bottom: 2px solid transparent; text-align: center; }
        .step-active { color: #2563eb; border-bottom-color: #2563eb; background: #eff6ff; }
        .photo-slot { aspect-ratio: 4/3; background: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 16px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #sig-pad { touch-action: none; cursor: crosshair; }
    </style>
</head>
<body onload="initApp()">

    <!-- 登录视图 (还原 V4.92) -->
    <div id="login-view">
        <div class="login-card">
            <h2 class="text-3xl font-black mb-2 italic">ASTON Q.A.</h2>
            <p class="text-[10px] text-blue-400 mb-8 tracking-[0.3em] uppercase">Professional V7.3 FINAL</p>
            <select id="login-id" class="input-dark">
                <option value="">选择账号 Account</option>
                <option value="Merchandiser_Boss">跟单总监 (Boss)</option>
                <option value="Inspector_Li">李检验员 (Li)</option>
                <option value="Inspector_Zhang">张检验员 (Zhang)</option>
            </select>
            <select id="login-role" class="input-dark">
                <option value="merchandiser">跟单 (Merchandiser)</option>
                <option value="inspector">检验 (Inspector)</option>
            </select>
            <button onclick="login()" class="btn-blue shadow-2xl">进入系统 LOGIN</button>
        </div>
    </div>

    <!-- 顶部导航 -->
    <header id="app-header" class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center hidden">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-black italic">A</div>
            <h1 class="font-black tracking-tighter text-lg italic uppercase">Aston <span class="text-blue-500">Pro</span></h1>
        </div>
        <div class="flex gap-2">
            <button onclick="syncCloud()" class="bg-blue-600 text-white text-[9px] font-black px-3 py-1.5 rounded-full uppercase shadow-lg">🔄 Sync</button>
            <button onclick="location.reload()" class="text-[9px] bg-slate-800 px-2 py-1.5 rounded-full font-bold">EXIT</button>
        </div>
    </header>

    <main id="app-content" class="hidden">
        <!-- 跟单视图 (还原任务下达) -->
        <div id="merch-view" class="p-4 space-y-4 hidden pb-20">
            <div class="bg-white p-6 rounded-[2.5rem] border shadow-xl">
                <h3 class="font-black text-lg mb-4 flex items-center gap-2 italic underline underline-offset-4 decoration-blue-500">NEW INSPECTION PLAN</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div class="col-span-2 bg-slate-50 p-3 rounded-2xl"><label class="text-[9px] font-black text-slate-400 uppercase">PO#</label><input id="new-po" class="w-full bg-transparent font-black text-sm outline-none uppercase" placeholder="PO2024"></div>
                    <div class="bg-slate-50 p-3 rounded-2xl"><label class="text-[9px] font-black text-slate-400 uppercase">Style</label><input id="new-style" class="w-full bg-transparent font-black text-sm outline-none" placeholder="Description"></div>
                    <div class="bg-slate-50 p-3 rounded-2xl"><label class="text-[9px] font-black text-slate-400 uppercase">Quantity</label><input type="number" id="new-qty" class="w-full bg-transparent font-black text-sm outline-none" placeholder="1000"></div>
                    <div class="col-span-2 bg-slate-50 p-3 rounded-2xl"><label class="text-[9px] font-black text-slate-400 uppercase">Factory</label><input id="new-factory" class="w-full bg-transparent font-black text-sm outline-none" placeholder="Factory Name"></div>
                    <div class="col-span-2 bg-blue-50 p-3 rounded-2xl border border-blue-100"><label class="text-[9px] font-black text-blue-600 uppercase">Assign To</label><select id="assign-user" class="w-full bg-transparent font-black text-sm outline-none"><option value="Inspector_Li">李检验员 (Li)</option><option value="Inspector_Zhang">张检验员 (Zhang)</option></select></div>
                </div>
                <button onclick="assignTask()" id="btnAssign" class="w-full mt-6 bg-slate-900 text-white py-5 rounded-3xl font-black shadow-xl active:scale-95 italic">SEND PLAN TO CLOUD</button>
            </div>
            <div id="merch-task-list" class="space-y-4 pt-6"></div>
        </div>

        <!-- 检验员视图 (任务列表卡片) -->
        <div id="inspector-view" class="p-4 space-y-4 hidden pb-20">
            <h2 class="text-2xl font-black italic border-b-4 border-blue-600 inline-block mb-4 uppercase tracking-tighter">My Tasks</h2>
            <div id="inspector-task-list" class="space-y-4"></div>
        </div>

        <!-- 专业 7 步验货流程 (还原核心魂) -->
        <div id="inspection-flow" class="hidden min-h-screen bg-slate-50">
            <nav class="flex bg-white border-b sticky top-16 z-40 overflow-x-auto no-scrollbar shadow-sm">
                <button onclick="switchStep(1)" class="step-nav-btn step-active" id="nav-1">1. SIGN<br>签到</button>
                <button onclick="switchStep(2)" class="step-nav-btn" id="nav-2">2. ENV<br>环境</button>
                <button onclick="switchStep(3)" class="step-nav-btn" id="nav-3">3. AQL<br>抽样</button>
                <button onclick="switchStep(4)" class="step-nav-btn" id="nav-4">4. APPEAR<br>外观</button>
                <button onclick="switchStep(5)" class="step-nav-btn" id="nav-5">5. SIZE<br>尺寸</button>
                <button onclick="switchStep(6)" class="step-nav-btn" id="nav-6">6. DEFECT<br>疵点</button>
                <button onclick="switchStep(7)" class="step-nav-btn" id="nav-7">7. REPORT<br>报告</button>
            </nav>

            <div class="p-4 pb-32">
                <!-- Step 1: Sign-in -->
                <section id="step-1" class="step-content">
                    <div class="bg-white rounded-[2.5rem] p-8 text-center space-y-6 shadow-2xl">
                        <h3 class="text-3xl font-black italic uppercase tracking-tighter">Check-in</h3>
                        <div class="photo-slot border-4 border-blue-500 rounded-[2rem]">
                            <input type="file" capture="camera" onchange="processImage(this, 'gate')" class="absolute inset-0 opacity-0 z-10">
                            <div id="gate-placeholder" class="text-center font-black text-blue-400">拍摄工厂大门<br>PHOTO AT GATE</div>
                            <img id="img-gate" class="hidden">
                        </div>
                        <button onclick="getGPS()" class="w-full py-5 bg-blue-600 text-white rounded-3xl font-black shadow-xl active:scale-95 italic">GET GPS LOCATION</button>
                        <p id="gps-display" class="text-[10px] font-mono text-slate-400">GPS: FIXED POSITION REQUIRED</p>
                    </div>
                </section>

                <!-- Step 3: AQL Sampling -->
                <section id="step-3" class="step-content hidden">
                    <div class="bg-white rounded-[2.5rem] p-8 text-center space-y-6 shadow-2xl">
                        <h3 class="font-black text-xl italic uppercase tracking-tighter underline">AQL 2.5 Sampling</h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-blue-50 p-6 rounded-[2rem]"><p class="text-[10px] font-black text-blue-600 uppercase">Sample Size</p><p id="aql-size" class="text-6xl font-black text-slate-900">--</p></div>
                            <div class="bg-red-50 p-6 rounded-[2rem]"><p class="text-[10px] font-black text-red-600 uppercase">AC / RE</p><p id="aql-ac-re" class="text-6xl font-black text-slate-900">--</p></div>
                        </div>
                        <p class="text-[9px] font-bold text-slate-400 uppercase italic">* Auto-calculated from order quantity</p>
                    </div>
                </section>

                <!-- Step 6: Defect Checklist -->
                <section id="step-6" class="step-content hidden">
                    <div class="bg-white rounded-[2.5rem] p-6 space-y-6 shadow-2xl">
                        <h4 class="font-black text-xl italic tracking-tighter uppercase underline decoration-red-500">Defect Checklist</h4>
                        <div id="defectContainer" class="grid grid-cols-2 gap-2"></div>
                        <div class="border-t-2 border-dashed pt-4">
                            <div class="photo-slot">
                                <input type="file" capture="camera" onchange="processImage(this, 'defect')" class="absolute inset-0 opacity-0 z-10">
                                <span class="text-slate-300 font-bold uppercase text-[10px]">拍摄主要疵点细节 SNAP DEFECT</span>
                                <img id="img-defect" class="hidden">
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Step 7: Finalize & Signature -->
                <section id="step-7" class="step-content hidden text-center">
                    <div class="bg-white rounded-[2.5rem] p-8 space-y-6 shadow-2xl">
                        <h4 class="font-black text-xl italic tracking-tighter uppercase border-b-2 pb-2">Inspection Result</h4>
                        <div class="bg-slate-900 p-6 rounded-[2rem] shadow-xl">
                            <label class="text-[10px] font-black text-blue-400 uppercase mb-2 block tracking-widest">Final Determination</label>
                            <select id="final-result" class="w-full bg-transparent text-white p-4 rounded-2xl font-black text-3xl outline-none text-center appearance-none italic">
                                <option value="PENDING" class="text-slate-800">PENDING</option>
                                <option value="PASS" class="text-slate-800">PASS ✅</option>
                                <option value="FAIL" class="text-slate-800">FAIL ❌</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic">Handwritten Signature 签字</label>
                            <canvas id="sig-pad" class="w-full h-40 bg-slate-50 border-2 border-slate-200 rounded-3xl shadow-inner"></canvas>
                            <button onclick="clearSig()" class="text-[8px] font-black text-red-400 uppercase">Clear</button>
                        </div>
                        <button id="btnSubmit" onclick="uploadData()" class="w-full py-6 bg-blue-600 text-white rounded-[2rem] font-black shadow-2xl active:scale-95 italic text-sm tracking-widest uppercase">
                            Finalize & Upload to Cloud
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script>
        const PLAN_API = "https://jsonblob.com/api/jsonBlob/019dfb3a-e88a-7406-92ba-437535a94e29";
        const RESULT_API = "https://api.npoint.io/07c1348873426e952613";
        
        let currentUser = '', currentRole = '', tasks = [], activeTask = null;
        let selectedDefects = [];
        const defects = ["Stains/污渍", "Skip Stitch/跳针", "Open Seam/脱线", "Shading/色差", "Measurement/尺寸", "Hole/破洞", "Dirty/脏污", "Wrinkle/折皱", "Zipper/拉链", "Label/标签", "Button/扣子", "Trim/线头", "Packing/包装", "Print/印花", "Fabric/面料", "Odour/异味", "Metal/金属"];

        function initApp() {
            const container = document.getElementById('defectContainer');
            defects.forEach(d => {
                const btn = document.createElement('button');
                btn.className = "p-3 text-[10px] font-black border-2 border-slate-100 rounded-xl bg-slate-50 text-slate-400 transition-all text-center";
                btn.innerText = d.split('/')[0];
                btn.onclick = () => {
                    btn.classList.toggle('bg-red-500'); btn.classList.toggle('text-white'); btn.classList.toggle('border-red-500');
                    if(selectedDefects.includes(d)) selectedDefects = selectedDefects.filter(i => i!==d);
                    else selectedDefects.push(d);
                };
                container.appendChild(btn);
            });
            initSig();
        }

        async function login() {
            currentUser = document.getElementById('login-id').value;
            currentRole = document.getElementById('login-role').value;
            if(!currentUser) return alert('Select Account');
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('app-header').classList.remove('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            if(currentRole === 'merchandiser') { document.getElementById('merch-view').classList.remove('hidden'); syncCloud(); } 
            else { document.getElementById('inspector-view').classList.remove('hidden'); syncCloud(); }
        }

        async function syncCloud() {
            try {
                const res = await fetch(PLAN_API);
                tasks = await res.json();
                if(Array.isArray(tasks)) { localStorage.setItem('aston_tasks', JSON.stringify(tasks)); renderTasks(); }
            } catch(e) { tasks = JSON.parse(localStorage.getItem('aston_tasks') || '[]'); renderTasks(); }
        }

        function renderTasks() {
            if(currentRole === 'merchandiser') {
                document.getElementById('merch-task-list').innerHTML = tasks.map((t, idx) => `
                    <div class="task-card p-5 border bg-white flex justify-between items-start">
                        <div><div class="font-black text-xl text-blue-600 italic tracking-tighter uppercase">${t.po}</div><div class="text-[10px] font-bold text-slate-400 uppercase">${t.factory} | ${t.qty} PCS</div></div>
                        <button onclick="deleteTask('${t.po}')" class="text-red-300 text-[10px] font-black uppercase italic">Delete</button>
                    </div>`).join('');
            } else {
                const myTasks = tasks.filter(t => t.inspector === currentUser);
                document.getElementById('inspector-task-list').innerHTML = myTasks.map(t => `
                    <div class="task-card p-6 bg-white flex justify-between items-center border-l-8 border-blue-600">
                        <div><div class="font-black text-xl italic uppercase tracking-tighter">${t.po}</div><div class="text-[10px] font-bold text-slate-400 uppercase">${t.factory} | ${t.style}</div></div>
                        <button onclick="startInspection('${t.po}')" class="bg-slate-900 text-white px-8 py-3 rounded-2xl text-[10px] font-black shadow-lg italic uppercase tracking-widest">Start</button>
                    </div>`).join('');
            }
        }

        async function assignTask() {
            const po = document.getElementById('new-po').value.toUpperCase();
            if(!po) return alert('PO REQUIRED');
            const t = { po, style: document.getElementById('new-style').value, qty: document.getElementById('new-qty').value, factory: document.getElementById('new-factory').value, inspector: document.getElementById('assign-user').value, time: new Date().toLocaleString() };
            tasks.unshift(t);
            const btn = document.getElementById('btnAssign'); btn.disabled = true; btn.innerText = "SENDING...";
            try {
                await fetch(PLAN_API, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(tasks) });
                alert('SUCCESS'); btn.disabled = false; btn.innerText = "SEND PLAN TO CLOUD";
                document.getElementById('new-po').value = ''; renderTasks();
            } catch(e) { alert('ERROR: ' + e.message); btn.disabled = false; }
        }

        function startInspection(po) {
            activeTask = tasks.find(t => t.po === po);
            document.getElementById('aql-size').innerText = calculateAQL(activeTask.qty).s;
            document.getElementById('aql-ac-re').innerText = calculateAQL(activeTask.qty).ac + "/" + calculateAQL(activeTask.qty).re;
            document.getElementById('inspector-view').classList.add('hidden');
            document.getElementById('inspection-flow').classList.remove('hidden');
            switchStep(1);
        }

        function switchStep(step) {
            document.querySelectorAll('.step-content').forEach(s => s.classList.add('hidden'));
            document.getElementById('step-'+step).classList.remove('hidden');
            document.querySelectorAll('.step-nav-btn').forEach(n => n.classList.remove('step-active'));
            document.getElementById('nav-'+step).classList.add('step-active');
            window.scrollTo(0,0);
        }

        function calculateAQL(qty) {
            const n = parseInt(qty) || 0;
            if (n <= 50) return { s: 8, ac: 0, re: 1 }; if (n <= 90) return { s: 13, ac: 0, re: 1 }; if (n <= 150) return { s: 20, ac: 1, re: 2 }; if (n <= 280) return { s: 32, ac: 2, re: 3 }; if (n <= 500) return { s: 50, ac: 3, re: 4 }; if (n <= 1200) return { s: 80, ac: 5, re: 6 }; return { s: 125, ac: 7, re: 8 };
        }

        function processImage(input, id) {
            const r = new FileReader(); r.onload = e => {
                const i = document.getElementById('img-'+id); i.src = e.target.result; i.classList.remove('hidden');
                document.getElementById(id+'-placeholder')?.classList.add('hidden');
            }; r.readAsDataURL(input.files[0]);
        }

        function getGPS() { navigator.geolocation.getCurrentPosition(p => { alert("Sign-in Success"); document.getElementById('gps-display').innerText = 'GPS: ' + p.coords.latitude.toFixed(4) + ',' + p.coords.longitude.toFixed(4); }, e => alert(e.message)); }

        async function uploadData() {
            const btn = document.getElementById('btnSubmit'); btn.disabled = true; btn.innerText = "UPLOADING...";
            const payload = { po: activeTask.po, result: document.getElementById('final-result').value, defects: selectedDefects, time: new Date().toLocaleString(), inspector: currentUser };
            try {
                const res = await fetch(RESULT_API); let cur = await res.json(); if(!Array.isArray(cur)) cur = [];
                cur.unshift(payload);
                await fetch(RESULT_API, { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(cur.slice(0,50)) });
                alert('SYNCED TO CLOUD & NAS!'); location.reload();
            } catch(e) { alert(e.message); btn.disabled = false; btn.innerText = "RETRY"; }
        }

        var sigPad, sigCtx, drawing = false;
        function initSig() {
            sigPad = document.getElementById('sig-pad'); if(!sigPad) return;
            sigCtx = sigPad.getContext('2d'); sigPad.width = sigPad.offsetWidth; sigPad.height = 160;
            sigCtx.lineWidth = 3; sigCtx.lineCap = 'round'; sigCtx.strokeStyle = '#000';
            const getPos = e => { const r = sigPad.getBoundingClientRect(); const cx = e.touches ? e.touches[0].clientX : e.clientX; const cy = e.touches ? e.touches[0].clientY : e.clientY; return { x: cx - r.left, y: cy - r.top }; };
            const start = e => { drawing = true; const p = getPos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); e.preventDefault(); };
            const move = e => { if(!drawing) return; const p = getPos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); e.preventDefault(); };
            sigPad.addEventListener('touchstart', start); sigPad.addEventListener('touchmove', move); window.addEventListener('touchend', () => drawing = false);
            sigPad.addEventListener('mousedown', start); sigPad.addEventListener('mousemove', move); window.addEventListener('mouseup', () => drawing = false);
        }
        function clearSig() { sigCtx.clearRect(0,0,sigPad.width,sigPad.height); }
        async function deleteTask(po) { if(confirm('Delete?')) { tasks = tasks.filter(t => t.po !== po); await fetch(PLAN_API, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(tasks) }); renderTasks(); } }
    </script>
</body>
</html>

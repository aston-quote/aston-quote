<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ASTON 任务发布中心 v6.3 (超级稳定版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-2xl mx-auto bg-white rounded-[2.5rem] shadow-2xl p-10 border border-slate-100">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-black text-slate-800 flex items-center">
                <span class="w-2 h-8 bg-blue-600 mr-3 rounded-full"></span> 任务发布中心
            </h1>
            <div id="statusTag" class="text-[10px] font-black px-3 py-1 bg-green-100 text-green-600 rounded-full">STABLE CLOUD</div>
        </div>
        
        <div class="space-y-4 mb-8 bg-slate-50 p-8 rounded-[2rem] border border-slate-200 shadow-inner">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 mb-2 tracking-widest uppercase">PO Number</label>
                    <input type="text" id="po" class="w-full p-4 rounded-2xl border-2 border-white outline-none focus:border-blue-600 font-black uppercase shadow-sm" placeholder="PO-2024">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-slate-400 mb-2 tracking-widest uppercase">Style Name</label>
                    <input type="text" id="style" class="w-full p-4 rounded-2xl border-2 border-white outline-none focus:border-blue-600 font-black shadow-sm" placeholder="款式名称">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-black text-slate-400 mb-2 tracking-widest uppercase">Target Quantity</label>
                    <input type="number" id="qty" class="w-full p-4 rounded-2xl border-2 border-white outline-none focus:border-blue-600 font-black shadow-sm" placeholder="1000">
                </div>
                <div class="flex items-end">
                    <button onclick="addPlan()" class="w-full py-4 bg-blue-600 text-white font-black rounded-2xl hover:bg-blue-700 transition-all shadow-lg active:scale-95">添加至计划列表</button>
                </div>
            </div>
        </div>

        <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">待发布任务预览</h2>
        <div id="planList" class="space-y-3 mb-10 min-h-[100px] border-2 border-dashed border-slate-100 rounded-3xl p-4"></div>

        <button onclick="pushToCloud()" id="btnPush" class="w-full py-6 bg-slate-900 text-white font-black rounded-3xl shadow-2xl active:scale-95 transition-all uppercase tracking-[0.3em] italic text-sm">
            发布计划到检验员手机
        </button>
    </div>

    <script>
        // v6.3 切换至超级稳定的 JSONBlob 服务
        const PLAN_API = "https://jsonblob.com/api/jsonBlob/019dfb3a-e88a-7406-92ba-437535a94e29";
        let plans = [];

        function addPlan() {
            const po = document.getElementById('po').value.toUpperCase();
            const style = document.getElementById('style').value;
            const qty = document.getElementById('qty').value;
            if(!po || !style) return alert("请完整填写 PO 和款式！");
            
            plans.unshift({ po, style, qty });
            render();
            document.getElementById('po').value = '';
            document.getElementById('style').value = '';
            document.getElementById('qty').value = '';
        }

        function render() {
            if(plans.length === 0) {
                document.getElementById('planList').innerHTML = '<div class="text-center py-10 text-slate-200 font-bold italic">暂无任务，请在上方录入</div>';
                return;
            }
            document.getElementById('planList').innerHTML = plans.map((p, i) => `
                <div class="flex justify-between items-center bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                    <div>
                        <div class="font-black text-blue-600 text-lg tracking-tighter">${p.po}</div>
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wide">${p.style} | ${p.qty} PCS</div>
                    </div>
                    <button onclick="plans.splice(${i},1);render()" class="w-8 h-8 flex items-center justify-center bg-red-50 text-red-400 rounded-full font-black">×</button>
                </div>
            `).join('');
        }

        async function pushToCloud() {
            if(plans.length === 0) return alert("请先添加计划！");
            const btn = document.getElementById('btnPush');
            btn.disabled = true;
            btn.innerText = "正在通过专线发布...";

            try {
                // JSONBlob 使用 PUT 来更新
                const res = await fetch(PLAN_API, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(plans)
                });

                if(res.ok) {
                    alert("【发布成功】\n\n专线已打通！检验员现在可以选单了。");
                    btn.innerText = "已发布 ✓";
                    btn.className = "w-full py-6 bg-green-600 text-white font-black rounded-3xl shadow-xl";
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerText = "发布计划到检验员手机";
                        btn.className = "w-full py-6 bg-slate-900 text-white font-black rounded-3xl shadow-2xl active:scale-95 transition-all uppercase tracking-[0.3em] italic text-sm";
                    }, 3000);
                } else { throw new Error("专线忙"); }
            } catch(e) {
                alert("发布失败：网络专线临时拥堵，请重试。");
                btn.disabled = false;
                btn.innerText = "重试发布";
            }
        }
        render();
    </script>
</body>
</html>

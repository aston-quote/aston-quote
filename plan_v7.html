<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ASTON 任务中心 v7.1 (微信码增强版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6">
    <div class="max-w-2xl mx-auto bg-white rounded-[2.5rem] shadow-2xl p-10 border border-slate-100">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-black text-slate-800 flex items-center">
                <span class="w-2 h-8 bg-blue-600 mr-3 rounded-full"></span> 任务中心 v7.1
            </h1>
            <div class="text-[10px] font-black px-3 py-1 bg-blue-600 text-white rounded-full uppercase">Dual Mode Ready</div>
        </div>
        
        <!-- 录入区 -->
        <div class="space-y-4 mb-8 bg-slate-50 p-8 rounded-[2rem] border border-slate-200">
            <div class="grid grid-cols-2 gap-4">
                <input type="text" id="po" class="w-full p-4 rounded-2xl border-2 border-white focus:border-blue-600 font-black uppercase" placeholder="PO#">
                <input type="text" id="style" class="w-full p-4 rounded-2xl border-2 border-white focus:border-blue-600 font-black" placeholder="Style">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <input type="number" id="qty" class="w-full p-4 rounded-2xl border-2 border-white focus:border-blue-600 font-black" placeholder="Qty">
                <button onclick="addPlan()" class="w-full py-4 bg-blue-600 text-white font-black rounded-2xl active:scale-95 shadow-lg">添加到列表</button>
            </div>
        </div>

        <!-- 列表 -->
        <div id="planList" class="space-y-3 mb-8 min-h-[100px] border-2 border-dashed border-slate-100 rounded-3xl p-4"></div>

        <!-- 发送区 -->
        <div class="grid grid-cols-1 gap-4">
            <button onclick="pushToCloud()" id="btnPush" class="w-full py-6 bg-slate-900 text-white font-black rounded-3xl shadow-2xl active:scale-95 text-sm tracking-widest italic">
                1. 尝试云端同步 (Cloud)
            </button>
            <button onclick="copyTaskCode()" class="w-full py-4 bg-blue-100 text-blue-600 font-black rounded-3xl active:scale-95 text-[11px] uppercase tracking-widest border-2 border-blue-200">
                2. 同步失败？生成微信任务码
            </button>
        </div>
    </div>

    <script>
        const CLOUD_API = "https://jsonblob.com/api/jsonBlob/019dfb3a-e88a-7406-92ba-437535a94e29";
        let plans = [];

        function addPlan() {
            const po = document.getElementById('po').value.toUpperCase();
            if(!po) return alert("请填写PO！");
            plans.unshift({ po, style: document.getElementById('style').value || "None", qty: document.getElementById('qty').value || 0 });
            render();
            document.getElementById('po').value = ''; document.getElementById('style').value = ''; document.getElementById('qty').value = '';
        }

        function render() {
            if(plans.length === 0) {
                document.getElementById('planList').innerHTML = '<div class="text-center py-10 text-slate-200 font-bold uppercase tracking-widest">No Tasks</div>';
                return;
            }
            document.getElementById('planList').innerHTML = plans.map((p, i) => `
                <div class="flex justify-between items-center bg-white p-5 rounded-2xl border shadow-sm">
                    <div><div class="font-black text-blue-600 text-lg uppercase">${p.po}</div><div class="text-[10px] font-bold text-slate-400 uppercase">${p.style} | ${p.qty} PCS</div></div>
                    <button onclick="plans.splice(${i},1);render()" class="w-8 h-8 flex items-center justify-center bg-red-50 text-red-400 rounded-full font-black">×</button>
                </div>
            `).join('');
        }

        async function pushToCloud() {
            if(plans.length === 0) return alert("请先添加计划！");
            const btn = document.getElementById('btnPush');
            btn.disabled = true; btn.innerText = "正在发布...";
            try {
                const res = await fetch(CLOUD_API, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(plans) });
                if(res.ok) {
                    alert("【云端同步成功】\n检验员刷新手机即可。");
                    btn.innerText = "已发布 ✓";
                    btn.className = "w-full py-6 bg-green-600 text-white font-black rounded-3xl shadow-xl";
                } else { throw new Error(); }
            } catch(e) {
                alert("云端同步失败 (网络拥堵)\n\n请使用下方的【微信任务码】功能！");
                btn.disabled = false; btn.innerText = "重新尝试云端同步";
            }
        }

        function copyTaskCode() {
            if(plans.length === 0) return alert("没有任务！");
            const code = "ASTON:" + btoa(unescape(encodeURIComponent(JSON.stringify(plans))));
            const input = document.createElement('textarea');
            input.value = code; document.body.appendChild(input);
            input.select(); document.execCommand('copy');
            document.body.removeChild(input);
            alert("【任务码已复制】\n\n请直接微信发给检验员，让他粘贴即可！");
        }
        render();
    </script>
</body>
</html>
